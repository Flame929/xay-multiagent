<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>AI 团队看板</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230F1115'/%3E%3Ccircle cx='10' cy='16' r='3' fill='%2310A37F'/%3E%3Ccircle cx='22' cy='16' r='3' fill='%234D6BFE'/%3E%3C/svg%3E">
<style>
/* ===== 视觉 token（沿用 ui-v4 §4.2，取自 DSH design-platform.css） ===== */
:root {
  --bg-base: #FFFFFF; --bg-sidebar: #F9FAFB; --bg-layer-1: #FFFFFF; --bg-layer-2: #FFFFFF; --bg-module: #F5F6F7;
  --bg-hover: rgba(38,49,72,.06); --bg-active: rgba(38,49,72,.10);
  --label-1: #0F1115; --label-2: #61666B; --label-3: #81858C; --label-4: #ADB2B8;
  --border-1: rgba(0,0,0,.04); --border-2: rgba(0,0,0,.10); --border-3: rgba(0,0,0,.12); --border-4: rgba(0,0,0,.16);
  --brand: #0F1115; --brand-text: #FFFFFF; --accent: #4176E6;
  --ok: #22C55E; --ok-bg: #E6FAED; --err: #EC1313; --err-bg: #FEE2E2;
  --warn: #F59E0B; --warn-label: #DD8629; --warn-bg: #FEF5E7; --idle: #CFD3D6; --unsafe: #DD8629;
  --ai-codex: #10A37F; --ai-dsh: #4D6BFE; --ai-agy: #9B72CB; --ai-other: #81858C;
  --lead-bubble: #F1F3F6;
  --hair: 0.5px;
  --sans: -apple-system, "PingFang SC", system-ui, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg-base: #151517; --bg-sidebar: #1B1B1C; --bg-layer-1: #232324; --bg-layer-2: #2C2C2E; --bg-module: #353638;
    --bg-hover: rgba(255,255,255,.08); --bg-active: rgba(255,255,255,.12);
    --label-1: #F1F3F5; --label-2: #ADB2B8; --label-3: #979DA6; --label-4: #61666B;
    --border-1: rgba(255,255,255,.06); --border-2: rgba(255,255,255,.12); --border-3: rgba(255,255,255,.16); --border-4: rgba(255,255,255,.20);
    --brand: #F9FAFB; --brand-text: #0F1115;
    --ok-bg: #233C2C; --err-bg: #570C0C; --warn-bg: #27241F; --idle: #81858C;
    --ai-codex: #1CB891; --ai-dsh: #627EFE; --ai-agy: #AB86D8;
    --lead-bubble: #2A2B2E;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"] {
  --bg-base: #151517; --bg-sidebar: #1B1B1C; --bg-layer-1: #232324; --bg-layer-2: #2C2C2E; --bg-module: #353638;
  --bg-hover: rgba(255,255,255,.08); --bg-active: rgba(255,255,255,.12);
  --label-1: #F1F3F5; --label-2: #ADB2B8; --label-3: #979DA6; --label-4: #61666B;
  --border-1: rgba(255,255,255,.06); --border-2: rgba(255,255,255,.12); --border-3: rgba(255,255,255,.16); --border-4: rgba(255,255,255,.20);
  --brand: #F9FAFB; --brand-text: #0F1115;
  --ok-bg: #233C2C; --err-bg: #570C0C; --warn-bg: #27241F; --idle: #81858C;
  --ai-codex: #1CB891; --ai-dsh: #627EFE; --ai-agy: #AB86D8;
  --lead-bubble: #2A2B2E;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.4);
}
@media (max-resolution: 1.9dppx) { :root { --hair: 1px; } }

/* ===== 基础 ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--sans); font-size: 14px; line-height: 24px; color: var(--label-1); background: var(--bg-base);
  -webkit-font-smoothing: antialiased; overflow: hidden;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
button:disabled { cursor: default; opacity: .5; }
textarea, input { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: 12px; }
.muted { color: var(--label-3); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--border-3); border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-track { background: transparent; }

/* ===== 状态图元：唯一的 loader 是旋转环 ===== */
.dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--idle); flex: none; }
.dot.ok { background: var(--ok); } .dot.err { background: var(--err); } .dot.warn { background: var(--warn); }
.dot.hollow { background: transparent; border: 1px solid var(--label-4); width: 7px; height: 7px; }
.dot.none { visibility: hidden; }
.ring { display: inline-block; width: 12px; height: 12px; border-radius: 50%; flex: none;
  border: 1.5px solid rgba(65,118,230,.25); border-top-color: var(--accent); animation: spin 1.5s linear infinite; }
.ring.sm { width: 10px; height: 10px; }
.slot { width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
@keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.shimmer { background: linear-gradient(90deg, var(--label-3) 0%, var(--label-1) 50%, var(--label-3) 100%); background-size: 200% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 1.5s linear infinite; }
@media (prefers-reduced-motion: reduce) { .ring, .shimmer, .cursor { animation: none !important; } .shimmer { color: var(--label-2); } }

/* ===== 应用框架 ===== */
.app { display: grid; grid-template-columns: 272px minmax(0, 1fr); height: 100vh; height: 100dvh; }
.sidebar { background: var(--bg-sidebar); border-right: var(--hair) solid var(--border-2); display: flex; flex-direction: column; min-width: 0; min-height: 0; user-select: none; }
.main { min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; background: var(--bg-base); }
.scrim { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.3); z-index: 30; }

/* 侧栏头部 */
.side-top { padding: 12px 10px 4px; display: flex; flex-direction: column; gap: 6px; flex: none; }
.home-row { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; border-radius: 8px; font-weight: 500; font-size: 13px; color: var(--label-1); }
.home-row:hover { background: var(--bg-hover); }
.home-row.active { background: var(--bg-active); }
.home-row .badge { margin-left: auto; }
.badge { font-size: 11px; line-height: 16px; padding: 0 6px; border-radius: 999px; background: var(--warn-bg); color: var(--warn-label); font-weight: 600; white-space: nowrap; flex: none; }
.badge.grey { background: var(--bg-module); color: var(--label-3); font-weight: 500; }
.search { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 9px; border-radius: 8px; background: var(--bg-base); border: var(--hair) solid var(--border-2); color: var(--label-3); }
.search:focus-within { border-color: var(--border-4); }
.search input { flex: 1; min-width: 0; border: none; background: transparent; outline: none; font-size: 13px; color: var(--label-1); }
.search input::placeholder { color: var(--label-3); }
.search input::-webkit-search-cancel-button { -webkit-appearance: none; }
.search svg { flex: none; }

/* 侧栏树：两级层次要一眼分清——
   工作区（文件夹）= 小号灰字分组标题：文件夹图标 + 名字 + 折叠三角，不像可点开的条目；
   对话 = 正常字号的条目：行首状态点，整行缩进到文件夹名下面，悬停 / 选中有底色 */
.side-tree { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 2px 10px 12px; min-height: 0; }
.ws-row { display: flex; align-items: center; gap: 5px; height: 24px; margin-top: 14px; padding: 0 6px; border-radius: 6px; font-size: 11px; line-height: 16px; font-weight: 500; letter-spacing: .01em; color: var(--label-3); cursor: pointer; }
.ws-row:first-child { margin-top: 6px; }
.ws-row:hover { background: var(--bg-hover); color: var(--label-2); }
.ws-row .fold { display: inline-flex; width: 14px; height: 14px; align-items: center; justify-content: center; flex: none; color: var(--label-4); }
.ws-row .fold svg { display: block; }
.ws-row .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ws-row .chev { transform: rotate(90deg); transition: transform .15s; margin-left: -2px; }
.ws-row.collapsed .chev { transform: none; }
.ws-row .mark { margin-left: auto; padding-left: 8px; display: inline-flex; align-items: center; }
.ws-row.legacy { color: var(--label-4); }
.chev { display: inline-block; width: 12px; height: 12px; flex: none; color: var(--label-4); line-height: 0; }
.chev svg { display: block; }
.row { display: flex; align-items: center; gap: 8px; height: 32px; margin: 1px 0; padding: 0 8px 0 10px; border-radius: 8px; font-size: 13px; line-height: 18px; color: var(--label-1); }
.row:hover { background: var(--bg-hover); }
.row.active { background: var(--bg-active); }
.row .slot { width: 14px; }
.row .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .st { flex: none; display: inline-flex; align-items: center; gap: 5px; font-size: 11px; line-height: 16px; color: var(--label-3); white-space: nowrap; }
.row .st.warn { color: var(--warn-label); font-weight: 500; }
.row .st:empty { display: none; }
.row.legacy .title { color: var(--label-2); }
.legacy-toggle { display: flex; align-items: center; gap: 4px; height: 26px; margin-top: 2px; padding: 0 8px 0 10px; font-size: 12px; color: var(--label-3); border-radius: 6px; cursor: pointer; }
.legacy-toggle:hover { background: var(--bg-hover); }
.legacy-toggle .chev { transition: transform .15s; }
.legacy-toggle.open .chev { transform: rotate(90deg); }
.side-empty { padding: 24px 12px; font-size: 12px; line-height: 18px; color: var(--label-3); text-align: center; }

/* 侧栏底部与额度 */
.side-foot { border-top: var(--hair) solid var(--border-2); padding: 10px 14px 12px; font-size: 12px; line-height: 18px; color: var(--label-2); display: flex; flex-direction: column; gap: 4px; flex: none; }
.slots { display: flex; flex-direction: column; gap: 4px; }
.slots .ai { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.ai-bar { width: 3px; height: 11px; border-radius: 2px; background: var(--ai-c); flex: none; }

/* 额度折叠头 */
.quota-header { display: flex; align-items: center; justify-content: space-between; padding: 2px 2px 4px; cursor: pointer; user-select: none; }
.quota-header:hover .quota-header-title { color: var(--label-1); }
.quota-header-title { font-size: 11px; font-weight: 600; color: var(--label-3); letter-spacing: 0.02em; }
.quota-header .chev { transition: transform .15s; transform: rotate(90deg); color: var(--label-4); }
.quota-header.collapsed .chev { transform: rotate(0deg); }

/* 额度卡片列表 */
.quota-list { display: flex; flex-direction: column; gap: 4px; width: 100%; margin-bottom: 2px; }
.quota-header-dots { display: inline-flex; gap: 3px; margin-left: 6px; }
.quota-header-dots .quota-dot { width: 7px; height: 7px; }
.quota-list.collapsed { display: none; }

/* 线路小卡片 */
.quota-card {
  background: var(--bg-module);
  border: var(--hair) solid var(--border-2);
  border-radius: 8px;
  padding: 6px 8px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
  cursor: default;
  transition: background .15s, border-color .15s;
}
.quota-card:hover {
  background: var(--bg-hover);
  border-color: var(--border-3);
}

/* 第一行：色块 + 线路名 + 右上角状态小标签 */
.quota-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; min-width: 0; }
.quota-name-wrap { display: flex; align-items: center; gap: 5px; min-width: 0; flex: 1; }
.quota-ai-bar { width: 4px; height: 12px; border-radius: 2px; background: var(--ai-c, var(--ai-other)); flex: none; }
.quota-line-name { font-size: 12px; font-weight: 500; color: var(--label-1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.quota-tag { font-size: 10px; line-height: 14px; padding: 1px 5px; border-radius: 4px; font-weight: 500; white-space: nowrap; flex: none; }
.quota-tag.ok { color: var(--ok); background: var(--ok-bg); }
.quota-tag.tight { color: var(--warn-label); background: var(--warn-bg); }
.quota-tag.exhausted { color: var(--err); background: var(--err-bg); }
.quota-tag.unknown { color: var(--label-3); background: var(--border-2); }

/* 第二行：近 5 小时用量大号数字 + 速度 */
.quota-usage-row { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; min-width: 0; }
.quota-usage-left { display: flex; align-items: baseline; min-width: 0; white-space: nowrap; }
.quota-usage-val { font-size: 13px; font-weight: 600; color: var(--label-1); font-variant-numeric: tabular-nums; white-space: nowrap; }
.quota-usage-unit { font-size: 11px; font-weight: 400; color: var(--label-3); margin-left: 2px; white-space: nowrap; }
.quota-speed { font-size: 10px; color: var(--label-3); white-space: nowrap; flex: none; text-align: right; }

/* 第三行：条 */
.quota-track { width: 100%; height: 4px; background: var(--border-2); border-radius: 2px; overflow: hidden; position: relative; }
.quota-fill { height: 100%; border-radius: 2px; transition: width .2s ease-out; }
.quota-fill.ok { background: var(--ok); }
.quota-fill.tight { background: var(--warn); }
.quota-fill.exhausted { background: var(--err); }
.quota-fill.unknown { background: var(--label-4); }
.quota-fill.rel { opacity: .6; }
.quota-usage-label { font-size: 10px; color: var(--label-3); margin-right: 4px; white-space: nowrap; }

/* 第四行：说明大白话 */
.quota-foot-row { display: flex; align-items: center; justify-content: space-between; gap: 4px; font-size: 10px; line-height: 14px; min-width: 0; }
.quota-foot-left { color: var(--label-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; min-width: 0; font-variant-numeric: tabular-nums; }
.quota-foot-left.dim { color: var(--label-4); }
.quota-foot-right { color: var(--label-3); white-space: nowrap; text-align: right; flex: none; }

/* 兼容保留 */
.quota-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; flex: none; }
.quota-dot.ok { background: var(--ok); }
.quota-dot.tight { background: var(--warn); }
.quota-dot.exhausted { background: var(--err); }
.quota-dot.unknown { background: var(--label-4); }
.tab .quota-dot { margin-left: 2px; margin-right: -2px; }
.conn { display: flex; align-items: center; gap: 6px; color: var(--label-3); }
.conn.bad { color: var(--err); }
.demo-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--label-3); }
.demo-pill button { font-size: 11px; color: var(--accent); }

/* ===== 主区通用 ===== */
.topbar { display: none; align-items: center; gap: 6px; height: 48px; padding: 0 10px 0 6px; border-bottom: var(--hair) solid var(--border-2); flex: none; min-width: 0; }
.topbar .tt { flex: 1; min-width: 0; font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.icon-btn { width: 34px; height: 34px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; color: var(--label-2); flex: none; }
.icon-btn:hover { background: var(--bg-hover); }
.page { flex: 1; overflow-y: auto; min-height: 0; }
.page-inner { max-width: 880px; margin: 0 auto; padding: 28px 24px 64px; }
h1 { font-size: 20px; line-height: 28px; font-weight: 600; }
.page-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
.page-head .sum { font-size: 13px; color: var(--label-3); }
.empty { padding: 48px 16px; text-align: center; color: var(--label-3); font-size: 13px; line-height: 20px; }
.empty b { display: block; font-size: 15px; font-weight: 500; color: var(--label-2); margin-bottom: 6px; }

/* 等你决定 */
.dec-bar { border: var(--hair) solid rgba(221,134,41,.35); border-left: 3px solid var(--warn); background: var(--warn-bg); border-radius: 12px; padding: 10px 14px; margin-bottom: 20px; min-width: 0; }
.dec-bar .dec-title { font-size: 13px; font-weight: 600; color: var(--warn-label); margin-bottom: 4px; }
.dec { padding: 8px 0; border-top: var(--hair) solid rgba(221,134,41,.2); min-width: 0; }
.dec:first-of-type { border-top: none; }
.dec .where { font-size: 12px; line-height: 18px; color: var(--label-3); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.dec .where a { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.dec .what { font-size: 14px; line-height: 21px; margin: 2px 0 6px; word-break: break-word; }
.dec .detail { font-size: 12px; line-height: 18px; color: var(--label-2); margin-bottom: 8px; white-space: pre-wrap; word-break: break-word; }
.dec .acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.dec .lead-doing { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--label-3); }
.dec .answer { display: flex; gap: 8px; width: 100%; }
.dec .answer input { flex: 1; min-width: 0; height: 32px; padding: 0 10px; border-radius: 8px; border: var(--hair) solid var(--border-3); background: var(--bg-base); outline: none; }
.dec .answer input:focus { border-color: var(--accent); }
details.more { font-size: 12px; color: var(--label-3); }
details.more summary { cursor: pointer; list-style: none; }
details.more summary::-webkit-details-marker { display: none; }
details.more .acts { margin-top: 6px; }

/* 按钮 */
.btn { height: 30px; padding: 0 12px; border-radius: 8px; font-size: 13px; border: var(--hair) solid var(--border-3); background: var(--bg-layer-1); color: var(--label-1); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; flex: none; }
.btn:hover:not(:disabled) { background: var(--bg-hover); }
.btn.primary { background: var(--brand); color: var(--brand-text); border-color: transparent; }
.btn.primary:hover:not(:disabled) { opacity: .9; background: var(--brand); }
.btn.danger { color: var(--err); }
.btn.danger:hover:not(:disabled) { background: var(--err-bg); }
.btn.sm { height: 26px; padding: 0 10px; font-size: 12px; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--label-2); }
.btn .ring { width: 10px; height: 10px; }

/* 我的事 列表 */
.home-list { border-top: var(--hair) solid var(--border-2); }
.home-row-item { display: grid; grid-template-columns: 16px minmax(0, 1.3fr) minmax(0, .7fr) minmax(0, 1.4fr) auto; gap: 12px; align-items: center; min-height: 52px; padding: 8px 8px; border-bottom: var(--hair) solid var(--border-2); }
.home-row-item:hover { background: var(--bg-hover); }
.home-row-item .t { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.home-row-item .ws { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--label-3); overflow: hidden; white-space: nowrap; min-width: 0; }
.home-row-item .ws svg { flex: none; color: var(--label-4); }
.home-row-item .ws span { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.home-row-item .s { font-size: 13px; color: var(--label-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.home-row-item .need { font-size: 12px; color: var(--label-3); white-space: nowrap; }
.home-row-item .need.yes { color: var(--warn-label); font-weight: 600; }
.home-row-item .need.look { color: var(--accent); }
.home-row-item .need.lead { color: var(--label-3); }
.page-head .lead-sum { font-size: 13px; color: var(--label-4); }
.home-legacy { margin-top: 12px; }

/* ===== 对话视图 ===== */
.conv { display: flex; flex-direction: column; height: 100%; min-height: 0; min-width: 0; }
.conv-head { padding: 16px 24px 0; flex: none; min-width: 0; }
.conv-head h1 { font-size: 17px; line-height: 24px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* 现状一句话：最要紧的一条用正常灰，其余（完成数、文件数、工作区、负责人）退成浅灰 */
.conv-head .line { display: flex; align-items: center; gap: 6px; margin-top: 3px; font-size: 13px; line-height: 20px; color: var(--label-2); min-width: 0; }
.conv-head .line .sum { flex: none; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.conv-head .line .rest { min-width: 0; color: var(--label-4); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.conv-head .line .ws { flex: 0 1 auto; color: var(--label-4); white-space: nowrap; max-width: 40%; overflow: hidden; text-overflow: ellipsis; }
.conv-head .line .rest::before, .conv-head .line .ws::before { content: '·'; margin-right: 6px; color: var(--label-4); }
.conv-head.loading h1 { color: var(--label-2); }

/* AI 切换条：默认一次只看一个 AI；宽屏可切到并排 */
.conv-bar { display: flex; align-items: flex-end; gap: 8px; padding: 10px 24px 0; border-bottom: var(--hair) solid var(--border-2); flex: none; min-width: 0; }
.conv-bar .tabs { display: flex; gap: 2px; min-width: 0; flex: 1 1 auto; overflow-x: auto; scrollbar-width: none; }
.conv-bar .tabs::-webkit-scrollbar { display: none; }
.tab { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px; font-size: 13px; color: var(--label-2); border-bottom: 2px solid transparent; white-space: nowrap; flex: none; border-radius: 6px 6px 0 0; margin-bottom: -1px; }
.tab:hover { color: var(--label-1); background: var(--bg-hover); }
.tab.active { color: var(--label-1); border-bottom-color: var(--label-1); font-weight: 500; }
.tab .cnt { color: var(--label-3); font-size: 12px; font-weight: 400; }
.tab .ring.sm, .tab .dot { margin-left: 1px; }
.conv-bar .tools { display: flex; align-items: center; gap: 2px; flex: none; height: 34px; }
.link-btn { font-size: 12px; color: var(--label-3); height: 26px; padding: 0 8px; border-radius: 6px; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.link-btn:hover { background: var(--bg-hover); color: var(--label-1); }
.link-btn.on { color: var(--label-1); background: var(--bg-active); }
.link-btn svg { display: block; }
.layout-btn { display: none; }

/* 阶段概览（可选视图） */
.phases { display: none; padding: 8px 24px 10px; border-bottom: var(--hair) solid var(--border-2); font-size: 13px; flex: none; max-height: 40%; overflow-y: auto; }
.phases.show { display: block; }
.phase-group { margin: 4px 0; }
.phase-group .pt { font-size: 12px; color: var(--label-3); margin-bottom: 2px; }
.phase-line { display: flex; align-items: center; gap: 8px; height: 26px; min-width: 0; }
.phase-line .ttl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.phase-line .st { color: var(--label-3); font-size: 12px; margin-left: auto; white-space: nowrap; flex: none; }

/* 列：tabs 模式只显示当前 AI 并居中；side 模式全部并排 */
.cols { flex: 1; min-height: 0; min-width: 0; display: flex; overflow: hidden; }
.cols.tabs { justify-content: center; }
.cols.tabs .col { display: none; width: 100%; }
.cols.tabs .col.active { display: flex; }
.cols.tabs .col-head { display: none; }
.cols.side { overflow-x: auto; overflow-y: hidden; }
.cols.side .col { display: flex; flex: 1 0 320px; max-width: 720px; border-right: var(--hair) solid var(--border-2); }
.cols.side .col:last-child { border-right: none; }
.col { flex-direction: column; min-height: 0; min-width: 0; }
.col-head { height: 40px; padding: 0 20px; display: flex; align-items: center; gap: 8px; border-bottom: var(--hair) solid var(--border-2); font-size: 13px; flex: none; min-width: 0; }
.col-head .nm { font-weight: 600; }
.col-head .cnt { color: var(--label-3); font-size: 12px; }
.col-head .live { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--accent); white-space: nowrap; }
.cols.side .col-body { padding: 20px 18px 24px 20px; }
/* 头像：官方标志。Codex/dsh 用 label-1（浅色黑、深色反白），agy 用 Gemini 蓝紫渐变，负责人用 Claude 橙 */
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.mk { display: inline-block; width: 14px; height: 14px; fill: currentColor; vertical-align: -2px; flex: none; }
.mk-agy { fill: url(#mk-agy-grad); }
.mk-claude { color: #D97757; }
.avatar { width: 24px; height: 24px; border-radius: 7px; background: var(--bg-module); color: var(--label-1); font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; flex: none; letter-spacing: -.02em; }
.avatar .mk { width: 15px; height: 15px; vertical-align: 0; }
.avatar.letter { background: var(--ai-c); color: #fff; }
.col-head .avatar, .tab .avatar { width: 20px; height: 20px; border-radius: 6px; }
.col-head .avatar .mk, .tab .avatar .mk { width: 13px; height: 13px; }
.col-body { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 16px 24px 24px; min-height: 0; overscroll-behavior: contain; scrollbar-gutter: stable; }
.col-body::-webkit-scrollbar-thumb { background: transparent; }
.col-body:hover::-webkit-scrollbar-thumb { background: var(--border-3); }
.col-inner { max-width: 880px; margin: 0 auto; min-width: 0; }
.cols.side .col-inner { max-width: none; }

/* 单行精简输入区 (arch-v6-org §3) */
.composer { flex: none; padding: 6px 32px 14px 24px; min-width: 0; }
.composer-box { max-width: 880px; margin: 0 auto; border: var(--hair) solid var(--border-3); border-radius: 19px; background: var(--bg-layer-1); padding: 3px 4px 3px 10px; display: flex; align-items: center; gap: 8px; box-shadow: 0 1px 2px rgba(0,0,0,.03); height: 38px; box-sizing: border-box; }
.composer-box:focus-within { border-color: var(--border-4); }
.composer-box .target-slot { display: inline-flex; align-items: center; justify-content: center; flex: none; width: 16px; height: 16px; }
.composer-box .target-slot .slot { width: 14px; height: 14px; }
.composer-box .target-select { appearance: none; -webkit-appearance: none; border: none; background: transparent; outline: none; font-size: 11px; color: var(--label-2); max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; padding-right: 10px; }
.composer-box .composer-input { flex: 1; min-width: 0; height: 100%; border: none; outline: none; background: transparent; font-size: 13px; line-height: 20px; padding: 0; color: var(--label-1); }
.composer-box .composer-input::placeholder { color: var(--label-3); }
.composer-box .send { width: 28px; height: 28px; border-radius: 50%; background: var(--brand); color: var(--brand-text); display: inline-flex; align-items: center; justify-content: center; flex: none; cursor: pointer; border: none; }
.composer-box .send:disabled { opacity: .3; cursor: default; }
.composer-box .send svg { display: block; }
.cols.side .composer { padding: 6px 20px 12px; }
.cols.side .composer-box { max-width: none; }

/* 多窗口与并排等分 (arch-v6-org §3) */
.win-topbar { display: flex; align-items: center; justify-content: space-between; padding: 4px 20px 8px; font-size: 12px; color: var(--label-3); flex: none; }
.win-topbar .hist-link { display: inline-flex; align-items: center; gap: 4px; color: var(--accent); cursor: pointer; background: none; border: none; padding: 2px 8px; border-radius: 6px; font-size: 12px; }
.win-topbar .hist-link:hover { background: var(--bg-hover); text-decoration: underline; }
.win-topbar .hist-link .rev { transform: rotate(180deg); }
.win-grid { display: grid; grid-template-columns: repeat(var(--win-cols, 2), minmax(0, 1fr)); gap: 12px; padding: 0 20px 16px; flex: 1; min-height: 0; box-sizing: border-box; overflow-y: auto; }
@media (max-width: 960px) {
  .win-grid { grid-template-columns: repeat(min(var(--win-cols, 2), 2), minmax(0, 1fr)); }
}
@media (max-width: 600px) {
  .win-grid { grid-template-columns: 1fr; }
}

/* 并排模式：某 AI 列上下等分 N 份 */
.cols.side .col.split-col { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.cols.side .col.split-col .col-body { display: flex; flex-direction: column; padding: 8px; gap: 8px; overflow: hidden; height: 100%; flex: 1; min-height: 0; }
.cols.side .col.split-col .col-body > .win-cell { flex: 1 1 0; min-height: 0; height: auto; }
.cols.side .col.split-col .composer { display: none; }

/* 窗口卡片结构 */
.win-cell { display: flex; flex-direction: column; border: var(--hair) solid var(--border-3); border-radius: 12px; background: var(--bg-layer-1); box-shadow: 0 1px 3px rgba(0,0,0,.03); overflow: hidden; min-height: 240px; }
.win-cell-head { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-bottom: var(--hair) solid var(--border-2); background: var(--bg-module); flex: none; font-size: 12px; line-height: 16px; min-width: 0; }
.win-cell-head .title { flex: 1; min-width: 0; font-weight: 600; color: var(--label-1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.win-cell-head .meta { flex: none; display: flex; align-items: center; gap: 6px; color: var(--label-3); font-size: 11px; }
.win-cell-body { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 10px 14px; min-height: 0; overscroll-behavior: contain; scrollbar-gutter: stable; }
.win-cell-body::-webkit-scrollbar-thumb { background: transparent; }
.win-cell-body:hover::-webkit-scrollbar-thumb { background: var(--border-3); }
.win-cell-foot { padding: 6px 8px 8px; border-top: var(--hair) solid var(--border-2); background: var(--bg-layer-1); flex: none; }
.win-cell-foot .composer-box { max-width: none; height: 34px; padding: 2px 4px 2px 8px; border-radius: 17px; }
.win-cell-foot .composer-box .send { width: 26px; height: 26px; }

/* 示例数据横幅 */
.demo-banner { display: flex; align-items: center; gap: 6px; min-height: 36px; padding: 6px 16px; background: var(--warn-bg); color: var(--warn-label); font-size: 13px; line-height: 18px; border-bottom: var(--hair) solid rgba(221,134,41,.35); flex: none; flex-wrap: wrap; }
.demo-banner[hidden] { display: none; }
.demo-banner b { font-weight: 600; }
.demo-banner span { color: var(--label-2); }
.demo-banner a { margin-left: auto; color: var(--accent); font-weight: 500; white-space: nowrap; }
.demo-banner a:hover { text-decoration: underline; }

/* 子线程：折起来是一行紧凑的列表行（标题 + 右侧状态），展开后是两行头部 + 消息流，留出呼吸空间 */
.thread { margin: 0 -8px; }
.thread.collapsed + .thread.collapsed { margin-top: 1px; }
.thread:not(.collapsed) { margin-top: 10px; margin-bottom: 28px; }
.thread:not(.collapsed):first-child, .phase-head + .thread:not(.collapsed), .older-toggle + .thread:not(.collapsed) { margin-top: 0; }
.thread:not(.collapsed):last-child { margin-bottom: 8px; }
.thread-head { display: grid; grid-template-columns: 16px minmax(0, 1fr); column-gap: 6px; padding: 8px 8px 10px; border-bottom: var(--hair) solid var(--border-2); cursor: pointer; user-select: none; border-radius: 8px 8px 0 0; }
.thread-head:hover .chev { color: var(--label-2); }
.thread-head .chev { grid-row: 1 / 3; align-self: center; transform: rotate(90deg); transition: transform .15s; }
.thread.collapsed .thread-head { grid-template-columns: 16px minmax(0, 1fr) auto; align-items: center; min-height: 34px; padding: 0 8px; border-bottom-color: transparent; border-radius: 8px; }
.thread.collapsed .thread-head:hover { background: var(--bg-hover); }
.thread.collapsed .thread-head .chev { transform: none; grid-row: 1; }
.thread.collapsed .thread-msgs { display: none; }
.thread-head .tl { display: flex; align-items: center; gap: 6px; min-width: 0; height: 22px; }
.thread-head .no { font-family: var(--mono); font-size: 11px; line-height: 18px; color: var(--label-4); flex: none; min-width: 22px; text-align: right; }
.thread-head .ttl { font-size: 13px; font-weight: 600; color: var(--label-1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.thread.collapsed .thread-head .ttl { font-weight: 400; }
.thread-head .ttl .cmd { font-family: var(--mono); font-size: 12px; font-weight: 400; color: var(--label-3); }
.thread-head .meta { grid-column: 2; display: flex; align-items: center; gap: 5px; height: 18px; font-size: 12px; line-height: 18px; color: var(--label-3); min-width: 0; white-space: nowrap; overflow: hidden; }
.thread.collapsed .thread-head .meta { grid-column: 3; grid-row: 1; padding-left: 12px; }
.thread-head .meta > * { flex: none; }
.thread-head .meta .sep { color: var(--label-4); }
.thread-head .meta .ph { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; color: var(--label-4); }
.thread-head .meta .slot { width: 12px; }
.thread-head .meta .run { color: var(--accent); } .thread-head .meta .warn { color: var(--warn-label); } .thread-head .meta .err { color: var(--err); }
/* 负责人待办（冲突未合并 / 失败待处理 / 失联）：是负责人 AI 的事，不是用户的，所以只用安静的灰色小标签，不上提醒色 */
.ltag { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: 4px; font-size: 11px; line-height: 18px; color: var(--label-3); background: var(--bg-module); white-space: nowrap; }
/* 固定搭档（worker）：负责人一直在对话的那个 AI 会话，用 @名字 的浅灰小字标出 */
.wk { display: inline-flex; align-items: center; height: 18px; padding: 0 5px; border-radius: 4px; font-size: 11px; line-height: 18px; font-family: var(--mono); color: var(--label-3); background: var(--bg-module); white-space: nowrap; flex: none; max-width: 120px; overflow: hidden; text-overflow: ellipsis; }
.thread-msgs { padding: 14px 8px 0; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
/* 任务严格按开始时间从早到晚排（像聊天，最新的在底部、挨着输入框）；
   最近几件之前的那一段连续旧任务——不管成功失败——整段折进「更早的 N 件」，标签上写明里面有几件失败 / 待负责人处理 */
.older-toggle { display: flex; align-items: center; gap: 4px; height: 30px; margin: 0 -8px 2px; padding: 0 8px; font-size: 12px; color: var(--label-3); border-radius: 8px; width: calc(100% + 16px); text-align: left; }
.older-toggle:hover { background: var(--bg-hover); color: var(--label-2); }
.older-toggle .sub { color: var(--label-4); }
.older-toggle .chev { transition: transform .15s; }
.older-toggle.open .chev { transform: rotate(90deg); }
.older { display: none; }
.older.open { display: block; }
.older.open + .thread, .older.open + .phase-head { margin-top: 10px; }
/* 并排的窄列里，折叠行右侧只留状态和用时 */
.cols.side .thread.collapsed .thread-head .meta .ph, .cols.side .thread.collapsed .thread-head .meta .fcount, .cols.side .thread.collapsed .thread-head .meta .sep:has(+ .fcount), .cols.side .thread.collapsed .thread-head .meta .sep:has(+ .ph), .cols.side .thread.collapsed .wk { display: none; }
/* 对话头部：待负责人处理的件数是安静的灰字，不用提醒色 */
.conv-head .line .lead { flex: none; color: var(--label-3); white-space: nowrap; }
.conv-head .line .lead::before { content: '·'; margin-right: 6px; color: var(--label-4); }

/* 负责人消息 */
.msg { min-width: 0; }
.msg.enter { animation: fadein .15s ease-out; }
.msg.lead { display: flex; justify-content: flex-end; }
.bubble { max-width: 85%; min-width: 0; background: var(--lead-bubble); border-radius: 16px 16px 4px 16px; padding: 8px 14px 9px; }
.bubble .tag { display: flex; align-items: center; gap: 6px; font-size: 11px; line-height: 16px; color: var(--label-3); margin-bottom: 3px; white-space: nowrap; }
.bubble .tag b { font-weight: 600; color: var(--label-2); }
.bubble .tag .src { padding: 0 5px; border-radius: 4px; background: var(--bg-active); }
.bubble .tag .src.warn { color: var(--warn-label); background: var(--warn-bg); }
.bubble .ttl { font-size: 14px; line-height: 21px; font-weight: 500; word-break: break-word; }
.bubble .txt { font-size: 13px; line-height: 20px; color: var(--label-2); white-space: pre-wrap; word-break: break-word; margin-top: 3px;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.bubble.open .txt { display: block; -webkit-line-clamp: unset; }
.bubble .more { font-size: 12px; color: var(--label-3); margin-top: 3px; }
.bubble .more:hover { color: var(--accent); }
.bubble .local { font-size: 11px; color: var(--label-4); margin-top: 2px; }
.bubble .local.err { color: var(--err); }

/* AI 消息 */
.msg.ai { display: flex; gap: 10px; }
.msg.ai .body { flex: 1; min-width: 0; }
.msg-meta { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--label-3); height: 22px; white-space: nowrap; overflow: hidden; }
.msg-meta b { font-weight: 600; color: var(--label-2); }
.msg-meta .sep { color: var(--label-4); }

/* 步骤 */
.steps { margin-top: 4px; border-radius: 10px; border: var(--hair) solid var(--border-2); overflow: hidden; background: var(--bg-layer-1); }
.steps-head { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px 0 8px; font-size: 13px; color: var(--label-3); cursor: pointer; user-select: none; min-width: 0; }
.steps-head:hover { background: var(--bg-hover); color: var(--label-2); }
.steps-head .chev { transition: transform .15s; }
.steps.open .steps-head .chev { transform: rotate(90deg); }
.steps-head .n { color: var(--label-2); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.steps-head .dur { margin-left: auto; font-size: 12px; font-family: var(--mono); color: var(--label-4); flex: none; }
.steps-list { display: none; padding: 2px 6px 6px; border-top: var(--hair) solid var(--border-1); }
.steps.open .steps-list { display: block; }
.steps-live { display: block; padding: 0 6px 6px; }
.steps.open .steps-live { display: none; }
.step { display: flex; align-items: center; gap: 6px; min-height: 24px; padding: 0 4px; border-radius: 6px; font-size: 13px; color: var(--label-3); cursor: pointer; min-width: 0; }
.step:hover { background: var(--bg-hover); color: var(--label-2); }
.step .ic { width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.step .ic svg { width: 14px; height: 14px; }
.step .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; min-width: 0; }
.step .r { font-family: var(--mono); font-size: 12px; color: var(--label-4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1 1 0; min-width: 0; }
.step .sfx { margin-left: auto; font-size: 11px; flex: none; padding-left: 6px; }
.step[data-state="error"] .t, .step[data-state="failed"] .t { color: var(--err); }
.step[data-state="error"] .sfx, .step[data-state="failed"] .sfx { color: var(--err); }
.step[data-state="active"] .t { color: var(--label-2); }
.step-raw { display: none; margin: 0 4px 6px 26px; padding: 6px 8px; background: var(--bg-module); border-radius: 8px; font-family: var(--mono); font-size: 12px; line-height: 18px; white-space: pre-wrap; word-break: break-all; color: var(--label-2); }
.step-raw.show { display: block; }

/* 思考 */
.think { margin-top: 6px; font-size: 13px; color: var(--label-3); min-width: 0; }
.think .th { display: flex; align-items: center; gap: 6px; cursor: pointer; height: 24px; max-width: 100%; min-width: 0; }
.think .th .lbl { flex: none; white-space: nowrap; }
.think .th:hover { color: var(--label-2); }
.think .pv { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; max-width: 60ch; -webkit-mask-image: linear-gradient(90deg, #000 85%, transparent); mask-image: linear-gradient(90deg, #000 85%, transparent); }
.think .full { display: none; white-space: pre-wrap; line-height: 20px; padding: 4px 0 4px 10px; border-left: 2px solid var(--border-3); margin: 2px 0 4px; word-break: break-word; }
.think.open .pv { display: none; }
.think.open .full { display: block; }

/* 回复 */
.reply { margin-top: 8px; font-size: 14px; line-height: 23px; word-break: break-word; min-width: 0; }
.reply.stream { white-space: pre-wrap; }
.cursor { display: inline-block; width: 2px; height: 16px; background: var(--label-1); vertical-align: -2px; margin-left: 1px; animation: blink 1s steps(1) infinite; }
.reply p { margin: 0 0 8px; } .reply p:last-child { margin-bottom: 0; }
.reply ul, .reply ol { margin: 0 0 8px 20px; }
.reply h3 { font-size: 14px; font-weight: 600; margin: 8px 0 4px; }
.reply code { font-family: var(--mono); font-size: 12.5px; background: var(--bg-module); padding: 1px 5px; border-radius: 4px; word-break: break-all; }
.reply pre { background: var(--bg-module); border-radius: 8px; padding: 8px 10px; overflow-x: auto; margin: 4px 0 8px; font-size: 12px; line-height: 18px; max-width: 100%; }
.reply pre code { background: none; padding: 0; font-size: 12px; word-break: normal; }
.mid-text { margin-top: 6px; font-size: 12px; color: var(--label-3); }
.mid-text summary { cursor: pointer; list-style: none; }
.mid-text summary::-webkit-details-marker { display: none; }
.mid-text .body { white-space: pre-wrap; padding: 4px 0 0 10px; border-left: 2px solid var(--border-3); margin-top: 4px; color: var(--label-2); line-height: 20px; word-break: break-word; }

/* 改动文件卡 */
.files { margin-top: 10px; border: var(--hair) solid var(--border-2); border-radius: 12px; background: var(--bg-layer-1); overflow: hidden; }
.files-head { display: flex; align-items: center; gap: 10px; height: 42px; padding: 0 12px; font-size: 13px; font-weight: 500; min-width: 0; }
.files-head .tile { width: 26px; height: 26px; border-radius: 7px; background: var(--bg-module); display: inline-flex; align-items: center; justify-content: center; color: var(--label-2); flex: none; }
.files-head .tx { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file { display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 12px 0 14px; font-family: var(--mono); font-size: 12px; color: var(--label-2); cursor: pointer; border-top: var(--hair) solid var(--border-1); min-width: 0; }
.file:hover { background: var(--bg-hover); color: var(--label-1); }
.file .p { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; direction: rtl; text-align: left; }
.file .p > span { direction: ltr; unicode-bidi: isolate; }
.file .hint { margin-left: auto; font-size: 11px; color: var(--label-4); font-family: var(--sans); flex: none; }
.files-more { height: 28px; padding: 0 14px; font-size: 12px; color: var(--label-3); border-top: var(--hair) solid var(--border-1); width: 100%; text-align: left; }
.files-more:hover { background: var(--bg-hover); }

/* 页脚状态 */
.msg-foot { display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 18px; color: var(--label-3); margin-top: 8px; flex-wrap: wrap; }
.msg-foot .st { display: inline-flex; align-items: center; gap: 4px; }
.msg-foot .st .slot { width: 12px; }
.msg-foot .st.err { color: var(--err); } .msg-foot .st.warn { color: var(--warn-label); } .msg-foot .st.run { color: var(--accent); }
.msg-foot .dur { font-variant-numeric: tabular-nums; }
.msg-foot .sep { color: var(--label-4); }

/* 控制条 */
.ctl { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.ctl .btns { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.ctl .note { font-size: 11px; color: var(--label-3); }
.waiting-note { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--label-3); }

/* 文件 / diff 侧面板 */
.dock { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 92vw); background: var(--bg-layer-1); border-left: var(--hair) solid var(--border-3); box-shadow: var(--shadow); z-index: 40; display: none; flex-direction: column; }
.dock.show { display: flex; }
.dock-head { display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 8px 0 16px; border-bottom: var(--hair) solid var(--border-2); font-size: 13px; flex: none; min-width: 0; }
.dock-head .p { font-family: var(--mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.dock-body { flex: 1; overflow: auto; padding: 12px 16px; font-family: var(--mono); font-size: 12px; line-height: 18px; white-space: pre; color: var(--label-2); }
.dock-body .add { color: var(--ok); } .dock-body .del { color: var(--err); } .dock-body .hunk { color: var(--accent); }

/* 对话框 / toast */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 50; display: none; align-items: center; justify-content: center; padding: 16px; }
.modal-bg.show { display: flex; }
.modal { width: 420px; max-width: 100%; background: var(--bg-layer-1); border-radius: 16px; box-shadow: var(--shadow); padding: 20px; }
.modal h2 { font-size: 15px; font-weight: 600; margin-bottom: 8px; word-break: break-word; }
.modal p { font-size: 13px; color: var(--label-2); line-height: 20px; white-space: pre-wrap; word-break: break-word; }
.modal .acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.toasts { position: fixed; left: 50%; top: 16px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; z-index: 60; pointer-events: none; max-width: calc(100vw - 32px); }
.toast { background: var(--brand); color: var(--brand-text); font-size: 13px; padding: 8px 14px; border-radius: 10px; box-shadow: var(--shadow); opacity: 1; transition: opacity .2s; word-break: break-word; }
.toast.err { background: var(--err); color: #fff; }
.toast.out { opacity: 0; }

/* ===== 响应式 ===== */
.demo-pill[hidden] { display: none; }
/* 线程筛选：挂在 AI 切换条右侧，一个 AI 下任务多时才出现；阶段小标题把同一次派活的任务分组 */
.filters { display: none; align-items: center; gap: 2px; flex: none; height: 34px; margin-left: 8px; padding-left: 8px; border-left: var(--hair) solid var(--border-2); }
.filters.show { display: flex; }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px; border-radius: 6px; font-size: 12px; color: var(--label-3); white-space: nowrap; }
.chip:hover { background: var(--bg-hover); color: var(--label-1); }
.chip.on { background: var(--bg-active); color: var(--label-1); }
.chip .n { font-variant-numeric: tabular-nums; opacity: .7; }
.phase-head { display: flex; align-items: center; gap: 8px; font-size: 12px; line-height: 16px; color: var(--label-3); margin: 20px 0 6px; white-space: nowrap; min-width: 0; }
.phase-head:first-child, .older-toggle + .phase-head { margin-top: 4px; }
.phase-head .t { overflow: hidden; text-overflow: ellipsis; }
.phase-head::after { content: ''; flex: 1; min-width: 24px; border-top: var(--hair) solid var(--border-2); }
.err-note { margin-top: 6px; padding: 6px 12px; border-left: 3px solid var(--err); border-radius: 4px; background: var(--bg-module); color: var(--label-1); font-size: 13px; line-height: 20px; word-break: break-word; white-space: pre-wrap; }
.stop-note, .no-reply { margin-top: 6px; font-size: 13px; line-height: 20px; color: var(--label-3); }

/* 简单 markdown（白名单）：段落、列表、标题、围栏代码、行内 code / 粗体。全部走文本节点，不注入 HTML。 */
function renderRich(text) {

      flushPara(); flushList();

      list.el.append(h('li', null, inline(ml[1]))); i++; continue;
    }

/* ======================================================================
 * 连接：SSE 优先，失败退回 3 秒轮询
 * ==================================================================== */
const EVENT_TYPES = ['state.changed', 'message.append', 'message.delta', 'message.update', 'thread.update', 'heartbeat'];
function connectSSE() {
  if (App.demo || typeof EventSource === 'undefined') return;
  const c = App.conn;
  if (c.es) { c.es.close(); c.es = null; }
  clearTimeout(c.retryTimer);
  c.gotEvent = false;
  const es = new EventSource('/api/events?since=' + encodeURIComponent(App.seq || 0));
  c.es = es;
  es.onopen = () => { setConn('sse'); };
  EVENT_TYPES.forEach(type => es.addEventListener(type, ev => {
    c.gotEvent = true; c.fails = 0;
    const id = parseInt(ev.lastEventId || '0', 10);
    if (type !== 'heartbeat' && id && id <= App.seq) return;      // 重连后的重复事件
    if (id) App.seq = id;
    stopPolling(); setConn('sse');
    let data = {};
    try { data = ev.data ? JSON.parse(ev.data) : {}; } catch (e) { data = {}; }
    handleEvent(type, data);
  }));
  es.onerror = () => {
    es.close(); if (c.es === es) c.es = null;
    if (!c.gotEvent) c.fails++;
    if (c.fails >= 3) { setConn('poll'); startPolling(); c.retryTimer = setTimeout(connectSSE, 15000); }
    else { setConn('reconnect'); c.retryTimer = setTimeout(connectSSE, c.gotEvent ? 800 : 2000); }
  };
}
function startPolling() {
  if (App.conn.pollTimer) return;
  App.conn.pollTimer = setInterval(() => { fetchState(); if (App.convId) fetchConversation(App.convId); }, 3000);
}
function stopPolling() { if (App.conn.pollTimer) { clearInterval(App.conn.pollTimer); App.conn.pollTimer = null; } }
function setConn(mode) {

/* ======================================================================
 * 事件处理（按 ui-v5-api §3 五种事件增量更新）
 * ==================================================================== */
function handleEvent(type, d) {
  if (type === 'heartbeat') return;
  if (type === 'state.changed') { fetchStateDebounced(); return; }
  if (!App.conv || d.conversation !== App.convId) return;
  const thread = App.conv.threads.find(t => t.id === d.thread);
  if (type === 'message.append') {
    if (!thread) { refetchConvDebounced(); return; }
    const m = d.message; if (!m || !m.id) return;
    if (thread.messages.some(x => x.id === m.id)) return;
    // 乐观插入的本地消息被服务端消息替换
    const localIdx = thread.messages.findIndex(x => x.local && x.kind === 'lead' && m.kind === 'lead' && (x.text || '') === (m.text || ''));
    if (localIdx >= 0) { removeMessageEl(thread.messages[localIdx].id); thread.messages.splice(localIdx, 1); }
    thread.messages.push(m);
    const te = App.els.threads.get(thread.id);
    if (te) { const el = renderMessage(m, thread); el.classList.add('enter'); te.msgs.append(el); refreshControls(thread); afterMutate(te.col); }
    refreshThreadHead(thread);
    return;
  }
  if (type === 'message.delta') {
    if (!thread) return;
    const m = thread.messages.find(x => x.id === d.message_id); if (!m) return;
    const me = App.els.msgs.get(m.id);
    if (d.text_delta) {
      m.text = (m.text || '') + d.text_delta;
      if (me && me.streamText) me.streamText.append(document.createTextNode(d.text_delta));
      else if (me) rerenderMessage(m, thread);
    }
    if (d.step) {
      m.steps = m.steps || [];
      if (!d.step.state) d.step.state = 'active';
      m.steps.forEach(s => { if (s.state === 'active') s.state = 'done'; });   // 顺序执行：新步到来视为上一步已结束
      m.steps.push(d.step);
      if (me && me.stepsEl) { const n = renderSteps(m, thread, !!m.streaming || SPINNING.has(m.status)); me.stepsEl.replaceWith(n); me.stepsEl = n; }   // 只换步骤区，不动正在流式的文字和输入框
      else if (me) rerenderMessage(m, thread);
    }
    const te = App.els.threads.get(thread.id); if (te) afterMutate(te.col);
    return;
  }
  if (type === 'message.update') {
    if (!thread) return;
    const m = thread.messages.find(x => x.id === d.message_id); if (!m) return;
    Object.assign(m, d.patch || {});
    rerenderMessage(m, thread);
    refreshThreadHead(thread);
    const te = App.els.threads.get(thread.id); if (te) afterMutate(te.col);
    return;
  }
  if (type === 'thread.update') {
    if (!thread) { refetchConvDebounced(); return; }
    Object.assign(thread, d.patch || {});
    refreshThreadHead(thread); refreshControls(thread); renderConvHead(); renderPhases(); renderFilters(); renderColHeads(); renderTabs(); refreshComposer(thread.agent);
  }
}

/* 把一次完整拉取的 conversation 合并进当前视图：只重绘有变化的消息，不整页重绘 */
function applyConversation(data) {
  const conv = data.conversation || findConv(App.convId) || { id: App.convId, title: '', agents: [] };
  const threads = (data.threads || []).map(t => Object.assign({ messages: [] }, t));
  if (!App.conv || !$('#conv-cols')) {
    App.conv = { conversation: conv, threads };
    renderConversation();
    return;
  }
  const old = App.conv;
  const oldIds = old.threads.map(t => t.id).join('|'), newIds = threads.map(t => t.id).join('|');
  const agentsChanged = JSON.stringify(conv.agents || []) !== JSON.stringify(old.conversation.agents || []);
  if (oldIds !== newIds || agentsChanged) {
    // 保留本地乐观消息
    threads.forEach(t => { const o = old.threads.find(x => x.id === t.id); if (o) o.messages.filter(m => m.local).forEach(m => { if (!t.messages.some(x => x.id === m.id)) t.messages.push(m); }); });
    App.conv = { conversation: conv, threads };
    renderConversation();
    return;
  }
  old.conversation = conv;
  threads.forEach(nt => {
    const ot = old.threads.find(x => x.id === nt.id);
    const te = App.els.threads.get(nt.id);
    const msgsChanged = nt.messages.length !== ot.messages.filter(m => !m.local).length;
    Object.keys(nt).forEach(k => { if (k !== 'messages') ot[k] = nt[k]; });
    nt.messages.forEach(nm => {
      const om = ot.messages.find(x => x.id === nm.id);

  // 按契约每条线程都带 lead_todo / worker 字段，没有就是 null
  Object.keys(threads).forEach(cid => threads[cid].forEach(t => { t.conv = cid; if (t.lead_todo === undefined) t.lead_todo = null; if (t.worker === undefined) t.worker = null; }));

  /* 回放脚本：把 SSE 事件按时间线逐条喂给 handleEvent */
  let timers = [];
  function at(ms, fn) { timers.push(setTimeout(fn, ms)); }
  function streamText(convId, tid, mid, text, startMs, perChar, onDone) {
    let i = 0, ms = startMs;
    while (i < text.length) {
      const n = 1 + Math.floor(Math.random() * 3);
      const chunk = text.slice(i, i + n); i += n;
      const chunkRef = chunk;
      at(ms, () => { const { m } = findMsg(convId, mid); if (m && m.streaming) { m.text += chunkRef; emit('message.delta', { conversation: convId, thread: tid, message_id: mid, text_delta: chunkRef }); } });
      ms += perChar * n;
    }
    if (onDone) at(ms + 200, onDone);
    return ms + 200;
  }
  function addStep(convId, tid, mid, ms, s) { at(ms, () => { const { m } = findMsg(convId, mid); if (!m || !m.streaming) return; m.steps.forEach(x => { if (x.state === 'active') x.state = 'done'; }); m.steps.push(s); emit('message.delta', { conversation: convId, thread: tid, message_id: mid, step: s }); }); }
  function finish(convId, tid, mid, ms, patch, threadPatch) {
    at(ms, () => { const { t, m } = findMsg(convId, mid); if (!m) return; m.steps.forEach(x => { if (x.state === 'active') x.state = 'done'; }); Object.assign(m, patch, { streaming: false }); emit('message.update', { conversation: convId, thread: tid, message_id: mid, patch: Object.assign({ steps: m.steps, streaming: false }, patch) }); if (threadPatch) { Object.assign(t, threadPatch); emit('thread.update', { conversation: convId, thread: tid, patch: threadPatch }); } });
  }
  function play() {
    timers.forEach(clearTimeout); timers = [];
    // Codex #1：继续两步 → 流式文字 → 完成
    const A = runs.c1a1, ma = 'm-c1a-6';
    addStep(C1, A, ma, 1200, step('cmd', '运行了 node --check', 'node --check /tmp/xay-watch.js', 'active'));
    addStep(C1, A, ma, 2600, step('edit', '改了 scripts/xay-watch.html', 'renderSidebar(): 按 workspaces → conversations 分组', 'active'));
    addStep(C1, A, ma, 4600, step('cmd', '运行了 node --check', 'node --check /tmp/xay-watch.js', 'active'));
    const textA = '语法错误修好了，node --check 通过。\n\n侧栏已经改成按对话分组：读 /api/state 的 workspaces[].conversations，一行一个负责人对话；没有负责人记录的旧运行合并成「以前的任务」，默认折叠。';
    const endA = streamText(C1, A, ma, textA, 6200, 28);
    finish(C1, A, ma, endA + 400, { status: 'done', final: textA + '\n\n改了 1 个文件：`scripts/xay-watch.html`。', files: ['scripts/xay-watch.html'], usage: { tokens: 18400 }, ended: now() + (endA + 400) / 1000 }, { status: 'done', active_run: null, updated: now() + (endA + 400) / 1000 });
    at(endA + 500, () => { convs[C1].counts = { running: 2, done: 3, failed: 0 }; emit('state.changed', {}); });

    // Codex #2：测试失败 → 修 → 通过 → 文字 → 完成；随后负责人续接，新一轮 message.append
    const B = runs.c1b1, mb = 'm-c1b-4';
    at(1800, () => { const { m } = findMsg(C1, mb); if (!m || !m.streaming) return; const s = m.steps[m.steps.length - 1]; s.state = 'error'; s.raw = 'python3 -m pytest tests/ -q\n1 failed, 13 passed\nFAILED tests/test_watch.py::test_registry_old_rows'; emit('message.update', { conversation: C1, thread: B, message_id: mb, patch: { steps: m.steps } }); });
    addStep(C1, B, mb, 3200, step('read', '读了 tests/test_watch.py', '', 'active'));
    addStep(C1, B, mb, 4400, step('edit', '改了 scripts/xay_normalize.py', '旧行缺字段时给默认值', 'active'));
    addStep(C1, B, mb, 5800, step('cmd', '运行了测试', 'python3 -m pytest tests/ -q\n14 passed', 'active'));
    const textB = '按你的插话只加了三个字段，没动文件格式。旧的 registry 行缺字段时现在给空值，测试 14 个全过。';
    const endB = streamText(C1, B, mb, textB, 8200, 30);
    finish(C1, B, mb, endB + 300, { status: 'done', final: textB, files: ['scripts/xay_normalize.py'], usage: { tokens: 15200 }, ended: now() + (endB + 300) / 1000 }, { status: 'done', active_run: null });
    at(endB + 2500, () => {
      const t = threads[C1][1];
      const lm = { kind: 'lead', id: 'm-c1b-5', ts: now(), source: 'resume', summary: '顺手把 stream.jsonl 的上限写进接口文档', text: '顺手把 stream.jsonl 的 512KB 上限和「新一轮开始时清空」写进 ui-v5-api.md 第 4 节。' };
      t.messages.push(lm); emit('message.append', { conversation: C1, thread: B, message: lm });
      const am = { kind: 'ai', id: 'm-c1b-6', ts: now() + 1, run: runs.c1b3, turn: 1, status: 'running', streaming: true, steps: [], thinking: '', text: '', final: null, files: [], usage: null };
      at(900, () => { t.messages.push(am); t.active_run = runs.c1b3; t.status = 'running'; emit('message.append', { conversation: C1, thread: B, message: am }); emit('thread.update', { conversation: C1, thread: B, patch: { status: 'running', active_run: runs.c1b3 } }); convs[C1].counts = { running: 2, done: 3, failed: 0 }; emit('state.changed', {}); });
      addStep(C1, B, 'm-c1b-6', 1800, step('read', '读了 references/plans/ui-v5-api.md', '', 'active'));
      addStep(C1, B, 'm-c1b-6', 3000, step('edit', '改了 references/plans/ui-v5-api.md', '第 4 节补 stream.jsonl 上限', 'active'));
      const textC = '写进去了：每轮开始时清空 stream.jsonl，结束后保留最后一轮，最多 512KB。';
      const endC = streamText(C1, B, 'm-c1b-6', textC, 4200, 30);
      finish(C1, B, 'm-c1b-6', endC + 300, { status: 'done', final: textC, files: ['references/plans/ui-v5-api.md'], usage: { tokens: 4100 }, ended: now() + (endC + 300) / 1000 }, { status: 'done', active_run: null });
      at(endC + 400, () => { convs[C1].counts = { running: 1, done: 4, failed: 0 }; emit('state.changed', {}); });
    });

    // agy：慢一点的流式
    const G = runs.c1g1, mg = 'm-c1g-2';
    addStep(C1, G, mg, 3000, step('cmd', '校验了 JSON', 'python3 -m json.tool references/examples/ui-v5-demo.json', 'active'));
    const textG = '示例数据写好了：2 个工作区、3 个对话，看板第五版这个对话里 Codex 并行 2 件，另有 dsh 和 agy 各 1 件，包含返工、插话和一次失败。';
    const endG = streamText(C1, G, mg, textG, 9000, 45);
    finish(C1, G, mg, endG + 300, { status: 'done', final: textG, files: ['references/examples/ui-v5-demo.json'], usage: { tokens: 6700 }, ended: now() + (endG + 300) / 1000 }, { status: 'done', active_run: null });
    at(endG + 400, () => { convs[C1].status = 'done'; convs[C1].counts = { running: 0, done: 8, failed: 0 }; convs[C1].updated = now(); agents.codex.slots.used = 0; agents.dsh.slots.used = 0; agents.agy.slots.used = 0; emit('state.changed', {}); });

    // dsh×3：并行推进
    addStep(C1, runs.c1d2, 'm-c1d2-2', 2000, step('edit', '改了 references/plans/ui-v5-api.md', '确认字段定义无遗漏', 'active'));
    streamText(C1, runs.c1d2, 'm-c1d2-2', '\n\n已核对完毕：当前各组件需要的字段均已在 ui-v5-api 中定义。', 3500, 30);

    addStep(C1, runs.c1d3, 'm-c1d3-2', 2400, step('cmd', '验证断点样式', '自检 1440px / 860px / 390px', 'active'));
    streamText(C1, runs.c1d3, 'm-c1d3-2', '\n\n样式检查通过：横向并排最多 4 列，超额自动换行；并排模式该列上下等分 3 份。', 4500, 30);

    addStep(C1, runs.c1d4, 'm-c1d4-2', 2800, step('cmd', '运行额度调度测试', 'pytest tests/test_quota.py', 'active'));
    streamText(C1, runs.c1d4, 'm-c1d4-2', '\n\n额度测试通过：sub 线路额度充足时优先调度，relay 超限时自动降级。', 5500, 30);
  }
  function reset() {
    // 重新回放：把进行中的消息恢复到初始态
    const { t: ta, m: ma } = findMsg(C1, 'm-c1a-6'); Object.assign(ma, { status: 'running', streaming: true, steps: [step('read', '读了 scripts/xay-watch.html'), step('edit', '改了 scripts/xay-watch.html', '修复第 812 行的括号', 'active')], text: '', final: null, files: [], usage: null, ended: undefined }); Object.assign(ta, { status: 'running', active_run: runs.c1a3 });
    const tb = threads[C1][1]; tb.messages = tb.messages.filter(x => !['m-c1b-5', 'm-c1b-6'].includes(x.id)); const mb = tb.messages.find(x => x.id === 'm-c1b-4'); Object.assign(mb, { status: 'running', streaming: true, steps: [step('say', '收到插话：只加字段，不改格式'), step('edit', '改了 scripts/xay_normalize.py', 'registry 行新增三个字段'), step('cmd', '运行了测试', 'python3 -m pytest tests/ -q', 'active')], text: '', final: null, files: [], usage: null, ended: undefined }); Object.assign(tb, { status: 'running', active_run: runs.c1b2 });
    const { t: tg, m: mg } = findMsg(C1, 'm-c1g-2'); Object.assign(mg, { status: 'running', streaming: true, steps: [step('read', '读了 references/plans/ui-v5-api.md'), step('write', '写了 references/examples/ui-v5-demo.json', '', 'active')], text: '', final: null, files: [], usage: null, ended: undefined }); Object.assign(tg, { status: 'running', active_run: runs.c1g1 });
    const rd2 = findMsg(C1, 'm-c1d2-2'); if (rd2.m) { Object.assign(rd2.m, { status: 'running', streaming: true, steps: [step('read', '读了 references/plans/ui-v5-api.md'), step('search', '搜索字段引用', '', 'active')], text: '正在复核字段覆盖度，确保 capabilities 和 usage 完全匹配…', final: null, files: [], usage: null }); rd2.t.status = 'running'; rd2.t.active_run = runs.c1d2; }
    const rd3 = findMsg(C1, 'm-c1d3-2'); if (rd3.m) { Object.assign(rd3.m, { status: 'running', streaming: true, steps: [step('read', '读了 scripts/xay-watch.html'), step('cmd', '检查 CSS grid 与 flex 等分', '', 'active')], text: '验证单列横向并排与并排模式上下等分…', final: null, files: [], usage: null }); rd3.t.status = 'running'; rd3.t.active_run = runs.c1d3; }
    const rd4 = findMsg(C1, 'm-c1d4-2'); if (rd4.m) { Object.assign(rd4.m, { status: 'running', streaming: true, steps: [step('read', '读了 scripts/xay_quota.py'), step('cmd', '运行测试套件', 'python3 -m unittest', 'active')], text: '验证各线路 priority 与 budget_share 额度限制…', final: null, files: [], usage: null }); rd4.t.status = 'running'; rd4.t.active_run = runs.c1d4; }
    Object.assign(convs[C1], { status: 'running', counts: { running: 6, done: 2, failed: 0 }, updated: now() });
    agents.codex.slots.used = 2; agents.dsh.slots.used = 3; agents.agy.slots.used = 1;
  }
  return { get, post, play, reset, C1 };
})();

/* ======================================================================
 * 启动
 * ==================================================================== */
function boot() {
  $('#search').addEventListener('input', e => { App.query = e.target.value; renderSidebar(); });
  $('#menu-btn').addEventListener('click', openSidebar);
  $('#scrim').addEventListener('click', closeSidebar);
  $('#dock-close').addEventListener('click', () => $('#dock').classList.remove('show'));
  $('#modal-cancel').addEventListener('click', closeModal);
  $('#modal-ok').addEventListener('click', () => { const fn = modalOk; closeModal(); if (fn) fn(); });
  $('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); $('#dock').classList.remove('show'); closeSidebar(); } });
  window.addEventListener('hashchange', onRoute);
  window.addEventListener('resize', debounce(() => { if (App.conv && $('#conv-tabs')) renderTabs(); }, 150));
  if (App.demo) {
    $('#demo-pill').hidden = false; setConn('demo');
    const banner = $('#demo-banner'); banner.hidden = false; $('#demo-exit').href = location.pathname;
    $('#demo-replay').addEventListener('click', () => { Demo.reset(); fetchState(); if (App.convId) fetchConversation(App.convId); setTimeout(Demo.play, 600); toast('重新回放'); });
    if (!location.hash || location.hash === '#/') location.hash = '#/c/' + encodeURIComponent(Demo.C1);
  }
  onRoute();
  fetchState().then(() => { if (App.demo) setTimeout(Demo.play, 1200); else connectSSE(); });
  window.addEventListener('online', () => { if (!App.demo && !App.conn.es) connectSSE(); });
}
document.addEventListener('DOMContentLoaded', boot);
})();
</script>
