            <line x1="26" y1="69" x2="55" y2="69" stroke="#4D6BFE" stroke-width="2" stroke-linecap="round"/>
            <line x1="26" y1="75" x2="70" y2="75" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
          </g>
        </g>`;
    } else if (state === 'sleeping') {
      // 显示器变暗 + 飘出 z z
      monitorContent = `<rect x="20" y="24" width="58" height="40" rx="3" fill="#0B0D11" opacity="0.45"/>`;
      extraEffects = `
        <g class="anim-zzz"><text x="115" y="21" font-size="11" font-weight="bold" fill="var(--label-3)" font-family="var(--mono)">z</text></g>
        <g class="anim-zzz-2"><text x="123" y="15" font-size="9" font-weight="bold" fill="var(--label-3)" font-family="var(--mono)">z</text></g>`;
    } else if (state === 'blocked') {
      // 头顶问号气泡
      monitorContent = `
        <line x1="26" y1="36" x2="60" y2="36" stroke="#EF4444" stroke-width="2" stroke-dasharray="3 3"/>
        <line x1="26" y1="44" x2="45" y2="44" stroke="#EF4444" stroke-width="2" stroke-dasharray="3 3"/>`;
      extraEffects = `
        <g transform="translate(108, 12)"><g class="anim-question">
          <circle cx="0" cy="0" r="8.5" fill="#EC1313"/>
          <text x="0" y="4" text-anchor="middle" font-size="11" font-weight="900" fill="#FFFFFF" font-family="var(--sans)">?</text>
        </g></g>`;
    } else if (state === 'failed') {
      // 显示器闪烁红光警报
      monitorContent = `
        <rect x="20" y="24" width="58" height="40" rx="3" class="anim-red-monitor"/>
        <text x="49" y="49" text-anchor="middle" font-size="18" font-weight="900" fill="#FFFFFF" font-family="var(--sans)">!</text>`;
    } else if (state === 'waiting') {
      // 翻转沙漏
      monitorContent = `
        <g transform="translate(49, 44)"><g class="anim-hourglass">
          <path d="M-6 -8 L6 -8 L1 -1 L6 6 L-6 6 L-1 -1 Z" fill="#F59E0B" stroke="#B45309" stroke-width="0.8"/>
        </g></g>`;
    } else {
      // idle 状态：光标闪烁
      monitorContent = `
        <text x="26" y="42" font-size="11" fill="#10A37F" font-family="var(--mono)">&gt;_</text>
        <line x1="26" y1="48" x2="50" y2="48" stroke="var(--border-3)" stroke-width="1.5"/>`;
    }

    return `
      <svg class="station-svg" viewBox="0 0 150 102" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
        <defs>
          <filter id="shadow-${uid}" x="-10%" y="-10%" width="120%" height="130%">
            <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.12"/>
          </filter>
        </defs>

        <!-- 角色本体 -->
        ${charSvg}

        <!-- 书桌与键盘底座 -->
        <g filter="url(#shadow-${uid})">
          <!-- 桌面 -->
          <rect x="10" y="66" width="130" height="9" rx="3" fill="var(--bg-layer-2)" stroke="var(--border-3)" stroke-width="1"/>
          <!-- 桌腿 -->
          <rect x="18" y="75" width="5" height="24" rx="1.5" fill="var(--border-3)"/>
          <rect x="127" y="75" width="5" height="24" rx="1.5" fill="var(--border-3)"/>
          <line x1="23" y1="84" x2="127" y2="84" stroke="var(--border-2)" stroke-width="1.5"/>
        </g>

        <!-- 键盘与触控板 -->
        <rect x="86" y="68" width="38" height="4" rx="1" fill="var(--bg-module)" stroke="var(--border-3)" stroke-width="0.5"/>

        <!-- 显示器支架 -->
        <rect x="46" y="58" width="6" height="9" fill="var(--border-3)"/>
        <rect x="38" y="66" width="22" height="2" rx="1" fill="var(--border-4)"/>

        <!-- 显示器外框 -->
        <rect x="18" y="22" width="62" height="44" rx="4" fill="#16181D" stroke="var(--border-4)" stroke-width="1.5" filter="url(#shadow-${uid})"/>
        <!-- 显示器屏幕底色 -->
        <rect x="20" y="24" width="58" height="40" rx="2.5" fill="#0D0F12"/>

        <!-- 显示器内部动效 -->
        ${monitorContent}

        <!-- 额外状态效果（气泡、Zzz 等；新角色自带，不再叠加） -->
        ${useChars ? '' : extraEffects}
      </svg>`;
  }

  // 状态文案
  function getStateLabel(state) {
    switch (state) {
      case 'working': return '工作中';
      case 'sleeping': return '休眠中';
      case 'blocked': return '已阻塞';
      case 'failed': return '上一轮失败';
      case 'waiting': return '等待中';
      default: return '空闲';
    }
  }

  // 每个人的任务清单（像待办清单）：✓ 做完、转圈 在做、✕ 没做成、空心 排队；只显示最近 3 件
  function taskListHtml(worker, state) {
    let tasks = (worker.tasks || []).slice();
    if (!tasks.length && worker.now) {
      tasks = [{ title: worker.now, status: state === 'working' ? 'running' : state === 'failed' ? 'failed' : state === 'waiting' ? 'queued' : 'done' }];
    }
    if (!tasks.length) return '<ul class="todo"><li class="todo-idle"><i></i><span>还没有任务</span></li></ul>';
    const shown = tasks.slice(-3), more = tasks.length - shown.length;
    return `<ul class="todo">${more > 0 ? `<li class="todo-more">…前面还有 ${more} 件</li>` : ''}${shown.map(t =>
      `<li class="todo-${escapeHtml(t.status || 'done')}"><i></i><span title="${escapeHtml(t.title)}">${escapeHtml(t.title)}</span></li>`).join('')}</ul>`;
  }

  // 渲染单个员工工位卡片
  function renderStationCard(worker, convId, deptId) {
    const agentType = getAgentType(worker.agent);
    const state = worker.state || 'idle';
    const stateLabel = getStateLabel(state);
    const charKey = (deptId || '') + '/' + (worker.worker || '');
    const label = escapeHtml((roster[charKey] || {}).label || worker.worker || '员工');
    baseStates[charKey] = state;
    const svgHtml = renderDeskSvg(agentType, state, charKey);
    const nowText = worker.now ? escapeHtml(worker.now) : '待命中';
    const workerName = escapeHtml(worker.worker || '员工');
    const agentName = escapeHtml(worker.agent || 'AI');

    // 点击员工跳到现有看板该线程（/#/c/<conversation> 并定位到线程）
    let threadHref = `/#/c/${encodeURIComponent(convId || '')}`;
    if (worker.thread) {
      threadHref += `?thread=${encodeURIComponent(worker.thread)}`;
    }

    return `
      <a href="${threadHref}" class="station-card" data-worker="${workerName}" data-dept="${deptId || ''}" title="点击跳转至看板线程：${workerName} (${agentName})">
        <span class="station-state-badge state-${state}">
          <span class="dot ${state === 'working' ? 'ok' : state === 'failed' || state === 'blocked' ? 'err' : state === 'waiting' ? 'warn' : 'idle'}"></span>
          ${stateLabel}
        </span>
        <div class="station-svg-wrap">
          ${svgHtml}
        </div>
        <div class="station-meta">
          <div class="station-name-row">
            <span class="station-worker-name name-${agentType}" title="${workerName}">${label}</span>
          </div>
          ${taskListHtml(worker, state)}
          <div class="station-progress p-${state}" title="${stateLabel}${worker.rounds ? ' · 第 ' + (Number(worker.rounds) || 1) + ' 轮' : ''}"><i></i></div>
        </div>
      </a>`;
  }

  // 渲染总经理工位
  function renderGmZone(gm, convId) {
    const gmZone = document.getElementById('gm-zone');
    if (!gmZone) return;
    const gmTitle = escapeHtml((gm && gm.title) || '总经理');
    const gmKind = escapeHtml((gm && gm.kind) || 'claude');
    const gmState = (gm && gm.state) || 'working';
    baseStates.gm = gmState;
    const gmSvg = renderDeskSvg('gm', gmState, 'gm');

    morph(gmZone, `
      <div class="gm-station-box" id="node-gm" data-node="gm" title="${gmKind}">
        <div class="gm-name">${gmTitle}</div>
        <div class="gm-desk-wrap">
          ${gmSvg}
        </div>
      </div>`);
  }

  const ROOM_COLORS = ['#4D6BFE', '#10A37F', '#E07A5F', '#9B72CB', '#E0A100', '#0EA5E9'];
  const ROBOT_SVG = `<svg class="robot" viewBox="0 0 60 64" width="52" height="56" aria-hidden="true">
    <line x1="30" y1="5" x2="30" y2="12" stroke="#2b2b2b" stroke-width="2"/>
    <circle class="robot-bulb" cx="30" cy="5" r="3.5" fill="#F59E0B" stroke="#2b2b2b" stroke-width="1.5"/>
    <rect x="10" y="12" width="40" height="28" rx="9" fill="#cfd8e3" stroke="#2b2b2b" stroke-width="2"/>
    <rect x="15" y="17" width="30" height="17" rx="6" fill="#1f2937"/>
    <g class="robot-eyes"><circle cx="24" cy="25" r="3" fill="#5eead4"/><circle cx="36" cy="25" r="3" fill="#5eead4"/></g>
    <path d="M25 30q5 3 10 0" stroke="#5eead4" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M12 47l-6 7M48 47l6 7" stroke="#2b2b2b" stroke-width="3" stroke-linecap="round"/>
    <rect x="16" y="42" width="28" height="19" rx="6" fill="#aab6c5" stroke="#2b2b2b" stroke-width="2"/>
    <rect x="23" y="46" width="14" height="10" rx="2" fill="#fff" stroke="#2b2b2b" stroke-width="1.2"/>
    <path d="M26 49h8M26 52h6" stroke="#9aa3ad" stroke-width="1.2"/>
  </svg>`;

  // 监工席：Claude 监工用小一号的 Claude 娘，规则监工是一个拿夹板的小机器人
  function renderHeadDesk(d, isClaudeHead, headText, busy, hasOpenReq) {
    const key = 'head:' + (d.id || '');
    const state = hasOpenReq ? 'blocked' : busy ? 'working' : 'idle';
    let face = ROBOT_SVG;
    if (hasChars()) {
      baseStates[key] = state;
      face = XayChars.render(isClaudeHead ? 'claude' : 'rules', { state: effectiveState(key), size: 64 })
        .replace('<svg ', `<svg data-char-key="${escapeHtml(key)}" `);
    }
    return `<div class="head-desk" id="node-head-${escapeHtml(d.id || '')}" title="${escapeHtml(headText)}">
      ${face}
      <div class="head-title">${isClaudeHead ? 'Claude 监工' : '监工娘'}</div>
    </div>`;
  }

  // 渲染所有部门与未分配员工
  function renderDepartments(departments, unassigned, convId) {
    const deptGrid = document.getElementById('dept-grid');
    if (!deptGrid) return;

    // 没建部门时，直接派活的员工也放进一间房，页面不空着
    if ((!departments || !departments.length) && unassigned && unassigned.length) {
      departments = [{ id: 'unassigned', name: '直接派活', head: 'none', members: unassigned, counts: {} }];
      unassigned = [];
    }
    if (!departments || departments.length === 0) {
      deptGrid.innerHTML = `<div class="dept-empty" style="grid-column: 1 / -1; padding: 40px;">还没有员工</div>`;
      return;
    }

    morph(deptGrid, departments.map(d => {
      const deptId = escapeHtml(d.id || '');
      const deptName = escapeHtml(d.name || d.id || '部门');
      const mission = escapeHtml(d.mission || '暂无使命描述');
      const headText = d.head === 'rules' ? '规则监工' : 'Claude 监工';
      const isClaudeHead = d.head === 'claude';
      const openReqs = (d.counts && d.counts.open_requests) || 0;
      const hasOpenReq = openReqs > 0;
      const members = d.members || [];

      const membersHtml = members.length > 0
        ? members.map(m => renderStationCard(m, convId, d.id)).join('')
        : `<div class="dept-empty" style="grid-column: 1 / -1;">本部门暂无在岗员工</div>`;
      const busy = members.some(m => m.state === 'working');
      const allTasks = members.flatMap(m => m.tasks || []);
      const doneTasks = allTasks.filter(t => t.status === 'done').length;
      const roomColor = ROOM_COLORS[departments.indexOf(d) % ROOM_COLORS.length];

      return `
        <div class="dept-card room ${busy ? 'busy' : ''}" id="node-dept-${deptId}" data-node="dept" data-dept-id="${deptId}" style="--room-c:${roomColor}">
          <div class="room-head">
            <span class="room-name room-sign" title="${mission}">${deptName}</span>
            <span class="room-pill">${busy ? '<span class="live"></span>' : ''}${members.length} 人</span>
            ${hasOpenReq ? `<span class="room-pill warn">${openReqs} 待答</span>` : ''}
            ${allTasks.length ? `<span class="room-progress" title="完成 ${doneTasks} / ${allTasks.length} 件"><i style="width:${Math.round(doneTasks * 100 / allTasks.length)}%"></i></span><span class="room-progress-text">${doneTasks}/${allTasks.length}</span>` : ''}
          </div>
          <div class="room-floor">
            ${d.head === 'none' ? '' : renderHeadDesk(d, isClaudeHead, headText, busy, hasOpenReq)}
            <div class="room-staff dept-members-grid">
              ${membersHtml}
            </div>
          </div>
        </div>`;
    }).join(''));

    // 未分配工位区
    const unassignedSec = document.getElementById('unassigned-section');
    if (unassignedSec) {
      if (unassigned && unassigned.length > 0) {
        unassignedSec.style.display = 'flex';
        morph(unassignedSec, `
          <div class="unassigned-title">
            <span class="dot"></span>
            <span>未入驻部门员工（${unassigned.length} 名）</span>
          </div>
          <div class="dept-members-grid">
            ${unassigned.map(m => renderStationCard(m, convId, 'unassigned')).join('')}
          </div>`);
      } else {
        unassignedSec.style.display = 'none';
        unassignedSec.innerHTML = '';
      }
    }
  }

  // 渲染顶部状态栏
  function updateTopStats(data) {
    const conv = data.conversation || {};
    const convId = conv.id || '';
    const convTitle = conv.title || 'AI 公司组织架构';
    const depts = data.departments || [];

    const totalDepts = depts.length;
    let totalWorkers = 0;
    let workingWorkers = 0;
    let totalOpenReqs = 0;

    depts.forEach(d => {
      const counts = d.counts || {};
      totalWorkers += (counts.members !== undefined ? counts.members : (d.members || []).length);
      workingWorkers += (counts.working !== undefined ? counts.working : (d.members || []).filter(m => m.state === 'working').length);
      totalOpenReqs += (counts.open_requests || 0);
    });

    if (data.unassigned) {
      totalWorkers += data.unassigned.length;
      workingWorkers += data.unassigned.filter(m => m.state === 'working').length;
    }

    document.getElementById('bar-title').textContent = convTitle + ' · 公司架构';
    document.getElementById('stat-depts').textContent = String(totalDepts);
    document.getElementById('stat-workers').textContent = `${workingWorkers}/${totalWorkers}`;
    document.getElementById('stat-requests').textContent = String(totalOpenReqs);

    const backLink = document.getElementById('back-link');
    if (backLink && convId) {
      backLink.href = `/#/c/${encodeURIComponent(convId)}`;
    }
  }

  // 部门间消息弧线计算与 SVG 渲染
  // 组织树：总经理 → 各部门房间（静态规整的线；有人在干活的部门，线上有往下流的小点）。
  // 第八版删掉了跨部门消息弧线和来回跑的小圆点，消息改由写信动画和右侧信件栏表达。
  // 折线点 → 圆角路径（拐弯处用二次曲线，半径 r）
  function roundedPath(pts, r) {
    const p = pts.filter((q, i) => i === 0 || Math.abs(q[0] - pts[i - 1][0]) > .5 || Math.abs(q[1] - pts[i - 1][1]) > .5);
    const f = n => n.toFixed(1);
    let d = `M ${f(p[0][0])} ${f(p[0][1])}`;
    for (let i = 1; i < p.length - 1; i++) {
      const [x0, y0] = p[i - 1], [x1, y1] = p[i], [x2, y2] = p[i + 1];
      const k1 = Math.min(r, Math.hypot(x1 - x0, y1 - y0) / 2), k2 = Math.min(r, Math.hypot(x2 - x1, y2 - y1) / 2);
      const ax = x1 - Math.sign(x1 - x0) * k1, ay = y1 - Math.sign(y1 - y0) * k1;
      const bx = x1 + Math.sign(x2 - x1) * k2, by = y1 + Math.sign(y2 - y1) * k2;
      d += ` L ${f(ax)} ${f(ay)} Q ${f(x1)} ${f(y1)} ${f(bx)} ${f(by)}`;
    }
    const last = p[p.length - 1];
    return d + ` L ${f(last[0])} ${f(last[1])}`;
  }
  function renderArcs() {
    const svg = document.getElementById('arc-canvas');
    const canvas = document.getElementById('office-canvas');
    const gmEl = document.getElementById('node-gm');
    if (!svg || !canvas || !gmEl) return;
    const base = canvas.getBoundingClientRect();
    const rel = el => { const r = el.getBoundingClientRect(); return { l: r.left - base.left, r: r.right - base.left, t: r.top - base.top, b: r.bottom - base.top, cx: (r.left + r.right) / 2 - base.left }; };
    const rooms = [...document.querySelectorAll('#dept-grid .dept-card.room')].map(el => ({ el, box: rel(el), color: el.style.getPropertyValue('--room-c') || '#4176E6' }));
    if (!rooms.length) { svg.innerHTML = ''; return; }
    const gm = rel(gmEl);
    const oneCol = new Set(rooms.map(r => Math.round(r.box.l))).size === 1;
    const firstRow = rooms.filter(r => Math.abs(r.box.t - rooms[0].box.t) < 4).sort((a, b) => a.box.l - b.box.l);
    const trunkX = oneCol ? rooms[0].box.l - 10 : (firstRow[0].box.r + firstRow[1].box.l) / 2;
    const splitY = oneCol ? gm.b + 18 : gm.b + Math.max(14, (rooms[0].box.t - gm.b) / 2);
    let trunkEnd = splitY, branches = '', flows = [];
    rooms.forEach(({ el, box, color }) => {
      // 分支：从主干上的分叉点出发，用部门颜色
      let fork, tail;
      if (oneCol) { fork = [trunkX, box.t + 28]; tail = [[box.l, box.t + 28]]; }
      else {
        const y = Math.abs(box.t - rooms[0].box.t) < 4 ? splitY : box.t - 28;
        fork = [trunkX, y]; tail = [[box.cx, y], [box.cx, box.t]];
      }
      trunkEnd = Math.max(trunkEnd, fork[1]);
      const end = tail[tail.length - 1];
      branches += `<path class="org-branch" style="stroke:${color}" d="${roundedPath([fork, ...tail], 16)}"/>` +
        `<circle class="org-node" style="stroke:${color}" cx="${end[0].toFixed(1)}" cy="${end[1].toFixed(1)}" r="4"/>`;
      if (el.classList.contains('busy')) {
        const pts = [[gm.cx, gm.b], [gm.cx, splitY], [trunkX, splitY], fork, ...tail];
        flows.push({ d: roundedPath(pts, 16), color });
      }
    });
    const trunk = `<path class="org-line" d="${roundedPath([[gm.cx, gm.b], [gm.cx, splitY], [trunkX, splitY], [trunkX, trunkEnd]], 16)}"/>` +
      `<circle class="org-node" cx="${gm.cx.toFixed(1)}" cy="${gm.b.toFixed(1)}" r="4"/>`;
    svg.innerHTML = trunk + branches + flows.map(f => `<path class="org-flow" style="stroke:${f.color};color:${f.color}" d="${f.d}"/>`).join('');
    if (reducedMotion()) return;
    // 光点：一小段亮线沿整条路径从总经理流到部门，循环
    svg.querySelectorAll('.org-flow').forEach((path, i) => {
      const len = path.getTotalLength();
      path.style.strokeDasharray = `22 ${Math.ceil(len + 30)}`;
      path.animate([{ strokeDashoffset: 22 }, { strokeDashoffset: -Math.ceil(len) }],
        { duration: Math.max(1600, len * 4), iterations: Infinity, easing: 'ease-in-out', delay: i * 400 });
    });
  }

  // ===== 写信动画：信封从发信人飞到收信人，落地冒一个小牌子 =====
  const LETTER_COLORS = { request: '#F59E0B', decision: '#22C55E', escalation: '#EC1313', report: '#81858C', auto: '#81858C' };
  const LETTER_WORDS = { request: '需求', decision: '结论', escalation: '上报', report: '汇报', auto: '通知', tell: '留言', reply: '回信' };
  let flying = 0;
  const flightQueue = [];
  function reducedMotion() { return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
  function nodeEl(key) {
    if (!key) return null;
    if (key === 'gm') return document.getElementById('node-gm');
    if (key.startsWith('dept:')) { const room = document.getElementById('node-dept-' + key.slice(5)); return room && (room.querySelector('.room-sign') || room); }
    const i = key.indexOf('/');
    const dept = key.slice(0, i), worker = key.slice(i + 1);
    return [...document.querySelectorAll('.station-card')].find(c => c.getAttribute('data-dept') === dept && c.getAttribute('data-worker') === worker) || null;
  }
  function centerOf(el) {
    const base = document.getElementById('office-canvas').getBoundingClientRect();
    const r = el.getBoundingClientRect();
    return { x: (r.left + r.right) / 2 - base.left, y: r.top + Math.min(r.height / 2, 46) - base.top };
  }
  function flyLetter(fromKey, toKey, type) {
    if (reducedMotion()) return;
    if (flying >= 3) { flightQueue.push([fromKey, toKey, type]); return; }
    const a = nodeEl(fromKey), b = nodeEl(toKey), canvas = document.getElementById('office-canvas');
    if (!a || !b || !canvas || a === b) return;
    const p0 = centerOf(a), p2 = centerOf(b);
    const p1 = { x: (p0.x + p2.x) / 2, y: Math.min(p0.y, p2.y) - 90 };
    const color = LETTER_COLORS[type] || '#4176E6';
    const env = document.createElement('div');
    env.className = 'letter-fly';
    env.innerHTML = `<svg viewBox="0 0 30 22" width="30" height="22"><rect x="1" y="1" width="28" height="20" rx="3" fill="#fff" stroke="${color}" stroke-width="2"/><path d="M2 3l13 10L28 3" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/><circle cx="15" cy="13" r="3" fill="${color}"/></svg>`;
    canvas.appendChild(env);
    const frames = [];
    for (let i = 0; i <= 16; i++) {
      const t = i / 16, u = 1 - t;
      const x = u * u * p0.x + 2 * u * t * p1.x + t * t * p2.x;
      const y = u * u * p0.y + 2 * u * t * p1.y + t * t * p2.y;
      const scale = 0.6 + Math.sin(Math.PI * t) * 0.6;
      frames.push({ transform: `translate(${x}px, ${y}px) rotate(${(t - 0.5) * 30}deg) scale(${scale})`, opacity: t > 0.92 ? 0.4 : 1 });
    }
    flying++;
    const anim = env.animate(frames, { duration: 1300, easing: 'ease-in-out' });
    anim.onfinish = () => {
      env.remove();
      const ping = document.createElement('div');
      ping.className = 'land-ping';
      ping.style.cssText = `left:${p2.x}px;top:${p2.y - 30}px;background:${color}`;
      ping.textContent = '✉ ' + (LETTER_WORDS[type] || '信件') + '送达';
      canvas.appendChild(ping);
      setTimeout(() => ping.remove(), 1500);
      flying--;
      if (flightQueue.length) setTimeout(() => flyLetter(...flightQueue.shift()), 150);
    };
  }

  // 庆祝：工位上方撒一把彩带
  function confetti(key) {
    if (reducedMotion()) return;
    const el = nodeEl(key), canvas = document.getElementById('office-canvas');
    if (!el || !canvas) return;
    const c = centerOf(el);
    const colors = ['#F59E0B', '#22C55E', '#4D6BFE', '#E07A5F', '#9B72CB', '#EC4899'];
    for (let i = 0; i < 16; i++) {
      const bit = document.createElement('span');
      bit.className = 'confetti';
      bit.style.background = colors[i % colors.length];
      canvas.appendChild(bit);
      const dx = (Math.random() - 0.5) * 140, up = 40 + Math.random() * 50, rot = (Math.random() - 0.5) * 720;
      bit.animate([
        { transform: `translate(${c.x}px, ${c.y}px) rotate(0)`, opacity: 1 },
        { transform: `translate(${c.x + dx * 0.6}px, ${c.y - up}px) rotate(${rot / 2}deg)`, opacity: 1, offset: 0.4 },
        { transform: `translate(${c.x + dx}px, ${c.y + 40}px) rotate(${rot}deg)`, opacity: 0 }
      ], { duration: 1300 + Math.random() * 400, easing: 'cubic-bezier(.2,.7,.4,1)' }).onfinish = () => bit.remove();
    }
  }

  // 格式化时间戳
  function formatTime(ts) {
    if (!ts) return '';
    const d = new Date(ts > 1e11 ? ts : ts * 1000);
    return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}:${String(d.getSeconds()).padStart(2, '0')}`;
  }

  // ===== 右侧信件栏：按时间正序，像聊天记录；答复挂在原信下面；只追加新信件，不整块重画 =====
  const LETTER_KINDS = { request: ['需求', 'k-request'], decision: ['结论', 'k-decision'], escalation: ['上报', 'k-escalation'],
    tell: ['留言', 'k-tell'], reply: ['回信', 'k-tell'], report: ['汇报', 'k-report'], auto: ['系统', 'k-report'], notice: ['通知', 'k-tell'] };
  function letterFoot(m, answered) {
    const parts = [];
    if (m.type === 'request') parts.push(m.status === 'open' && !answered ? '<span class="letter-chip chip-wait">待答复</span>' : '<span class="letter-chip chip-ok">已答复</span>');
    if (m.verdict) {
      const v = String(m.verdict).toLowerCase();
      parts.push(`<span class="letter-chip ${v === 'reject' ? 'chip-err' : v === 'modify' ? 'chip-wait' : 'chip-ok'}">${v === 'reject' ? '驳回' : v === 'modify' ? '按修改执行' : '同意'}</span>`);
    }
    if (m.delivered === true) parts.push('<span class="letter-chip chip-sent">✓ 已送达</span>');
    else if (m.delivered === false) parts.push('<span class="letter-chip chip-going"><span class="hourglass">⏳</span> 投递中</span>');
    if (m.contract) parts.push(`<span class="letter-chip">约定 ${escapeHtml(m.contract)}</span>`);
    return parts.join('');
  }
  function letterHtml(m, answered, depts) {
    const from = whoIs(m.from, depts);
    const to = m.to_worker ? whoIs({ dept: m.to, worker: m.to_worker }, depts) : whoIs(m.to || 'gm', depts);
    const [kindText, kindCls] = LETTER_KINDS[m.type] || [m.type || '信件', 'k-report'];
    const id = escapeHtml(m.id || '');
    const body = String(m.body || '');
    return `<div class="letter ${kindCls}" id="msg-card-${id}" data-id="${id}">
      <div class="letter-avatar">${avatarHtml(from.type, 48, 'idle')}</div>
      <div class="letter-bubble">
        <div class="letter-head"><b class="name-${from.type}">${escapeHtml(from.label)}</b><span class="letter-arrow">→</span><b class="name-${to.type}">${escapeHtml(to.label)}</b>
          <span class="letter-kind ${kindCls}">${kindText}</span><span class="letter-time mono">${formatTime(m.ts)}</span></div>
        ${m.subject ? `<div class="letter-subject">${escapeHtml(humanize(m.subject))}</div>` : ''}
        ${body && body !== m.subject ? `<div class="letter-body clamp">${escapeHtml(humanize(body))}</div>${body.length > 70 ? '<button class="letter-more" type="button">展开</button>' : ''}` : ''}
        ${m.answer && m.answer !== body ? `<div class="letter-answer"><b>答复：</b>${escapeHtml(humanize(m.answer))}</div>` : ''}
        <div class="letter-foot">${letterFoot(m, answered)}</div>
      </div>
    </div>`;
  }
  function renderBusMessages(messages) {
    const listEl = document.getElementById('bus-list');
    const countEl = document.getElementById('bus-count');
    if (!listEl) return;
    const depts = (currentData && currentData.departments) || [];
    const msgs = (messages || []).filter(m => m && m.type !== 'delivered').slice().sort((x, y) => (x.ts || 0) - (y.ts || 0));
    if (countEl) countEl.textContent = String(msgs.length);
    if (!msgs.length) { listEl.innerHTML = '<div class="dept-empty">还没有信件</div>'; return; }

    const byId = new Map(msgs.map(m => [m.id, m]));
    const answered = new Set(msgs.filter(m => m.reply_to && byId.has(m.reply_to)).map(m => m.reply_to));
    // 根信：reply_to 指向列表外的（或没有）；答复挂在它的根信下面
    const rootOf = m => { let cur = m, guard = 0; while (cur.reply_to && byId.has(cur.reply_to) && guard++ < 20) cur = byId.get(cur.reply_to); return cur.id; };
    const scroller = listEl.closest('.tab-content');
    const atBottom = !scroller || scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 80;
    const known = new Set([...listEl.querySelectorAll('.letter[data-id]')].map(el => el.getAttribute('data-id')));
    const fresh = !listEl.querySelector('.letter') || [...known].some(id => !byId.has(id));
    if (fresh) listEl.innerHTML = '';
    let added = 0;
    msgs.forEach(m => {
      const id = String(m.id || '');
      const existing = !fresh && document.getElementById('msg-card-' + id);
      if (existing) {
        const foot = existing.querySelector(':scope > .letter-bubble > .letter-foot');
        const html = letterFoot(m, answered.has(m.id));
        if (foot && foot.innerHTML !== html) foot.innerHTML = html;
        return;
      }
      const holder = document.createElement('div');
      holder.innerHTML = letterHtml(m, answered.has(m.id), depts);
      const el = holder.firstElementChild;
      if (!fresh) el.classList.add('letter-new');
      const root = rootOf(m);
      if (root !== m.id) {
        const rootEl = document.getElementById('msg-card-' + root);
        if (rootEl) {
          let box = rootEl.querySelector(':scope > .letter-replies');
          if (!box) { box = document.createElement('div'); box.className = 'letter-replies'; rootEl.appendChild(box); }
          el.classList.add('is-reply');
          box.appendChild(el);
          added++;
          return;
        }
      }
      listEl.appendChild(el);
      added++;
    });
    if (scroller && (fresh || (added && atBottom))) scroller.scrollTo({ top: scroller.scrollHeight, behavior: fresh ? 'auto' : 'smooth' });
    if (!listEl.dataset.bound) {
      listEl.dataset.bound = '1';
      listEl.addEventListener('click', e => {
        const more = e.target.closest('.letter-more');
        if (more) {
          const bodyEl = more.previousElementSibling;
          const open = bodyEl.classList.toggle('clamp');
          more.textContent = open ? '展开' : '收起';
          e.stopPropagation();
          return;
        }
        const card = e.target.closest('.letter[data-id]');
        if (card) selectMessage(card.getAttribute('data-id'), true);
      });
    }
  }

  // 渲染任务拆解 (Plan 树)
  // 任务拆解：每件事交给了谁、做到哪了（按部门分组；没有部门的放"直接派活"）
  const PLAN_STATE = { done: ['已完成', 's-done'], running: ['进行中', 's-running'], in_progress: ['进行中', 's-running'], working: ['进行中', 's-running'],
    failed: ['没做成', 's-failed'], queued: ['排队中', 's-queued'], pending: ['待开始', 's-queued'] };
  function renderPlanTree(plan, departments) {
    const listEl = document.getElementById('plan-list');
    const countEl = document.getElementById('plan-count');
    if (!listEl) return;
    const items = (plan || []).slice();
    if (countEl) countEl.textContent = String(items.length);
    if (!items.length) { listEl.innerHTML = '<div class="dept-empty">还没有派出任务</div>'; return; }
    const depts = departments || [];
    const groups = new Map();
    items.forEach(p => { const k = p.dept || ''; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(p); });
    const count = st => items.filter(p => (PLAN_STATE[p.status] || [])[1] === st).length;
    const summary = `<div class="plan-summary"><span class="plan-state s-done">完成 ${count('s-done')}</span><span class="plan-state s-running">进行中 ${count('s-running')}</span>` +
      `${count('s-queued') ? `<span class="plan-state s-queued">等待 ${count('s-queued')}</span>` : ''}${count('s-failed') ? `<span class="plan-state s-failed">没做成 ${count('s-failed')}</span>` : ''}</div>`;
    listEl.innerHTML = summary + [...groups.entries()].map(([deptId, rows]) => {
      const idx = depts.findIndex(d => d.id === deptId);
      const d = depts[idx];
      const color = idx >= 0 ? ROOM_COLORS[idx % ROOM_COLORS.length] : 'var(--label-4)';
      return `<div class="plan-group" style="--g-c:${color}"><div class="plan-group-title">${escapeHtml(d ? (d.name || d.id) : (deptId || '直接派活'))}</div>` +
        rows.map(p => {
          const who = p.worker ? whoIs({ dept: p.dept, worker: p.worker }, depts) : { type: getAgentType(p.agent), label: AI_NAMES[getAgentType(p.agent)] || '待分配' };
          const [stText, stCls] = PLAN_STATE[p.status] || ['待开始', 's-queued'];
          return `<div class="plan-row"><span class="plan-ava">${avatarHtml(who.type, 40, 'idle')}</span>
            <div class="plan-main"><div class="plan-title" title="${escapeHtml(p.title || '')}">${escapeHtml(p.title || '任务')}</div>
            <div class="plan-who">交给 <b class="name-${who.type}">${escapeHtml(who.label)}</b></div></div>
            <span class="plan-state ${stCls}">${stText}</span></div>`;
        }).join('') + '</div>';
    }).join('');
  }

  // 选中并高亮消息
  // 选中一封信：信件高亮；发信人、收信人的工位闪一下
  function selectMessage(msgId, fromPanel) {
    if (!msgId) return;
    const sidePanel = document.getElementById('side-panel');
    if (sidePanel && !fromPanel) {
      sidePanel.classList.remove('collapsed');
      if (window.innerWidth <= 768) sidePanel.classList.add('mobile-open');
    }
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.toggle('active', btn.getAttribute('data-tab') === 'bus'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.toggle('active', c.id === 'tab-bus'));
    document.querySelectorAll('.letter.selected').forEach(c => c.classList.remove('selected'));
    const target = document.getElementById('msg-card-' + msgId);
    if (target) {
      target.classList.add('selected');
      if (!fromPanel) target.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    const m = ((currentData && currentData.messages) || []).find(x => String(x.id) === String(msgId));
    if (!m) return;
    const to = m.to_worker ? { dept: m.to, worker: m.to_worker } : (m.to === 'gm' ? 'gm' : null);
    const keys = [workerKey(currentData, m.from), workerKey(currentData, to) || (m.to ? 'dept:' + m.to : null)];
    keys.forEach(k => {
      let el = nodeEl(k);
      if (el && el.classList.contains('room-sign')) el = el.closest('.dept-card') || el;
      if (!el) return;
      el.classList.remove('flash-ping');
      void el.offsetWidth;
      el.classList.add('flash-ping');
      setTimeout(() => el.classList.remove('flash-ping'), 1300);
    });
  }

  // 绑定侧边栏 Tab 切换与展开折叠
  function setupSidePanelEvents() {
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const tab = btn.getAttribute('data-tab');
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        const activeContent = document.getElementById('tab-' + tab);
        if (activeContent) activeContent.classList.add('active');
      });
    });

    const toggleBtn = document.getElementById('panel-toggle-btn');
    const closeBtn = document.getElementById('panel-close-btn');
    const sidePanel = document.getElementById('side-panel');
    if (toggleBtn && sidePanel) {
      toggleBtn.addEventListener('click', () => {
        if (window.innerWidth <= 768) {
          sidePanel.classList.toggle('mobile-open');
        } else {
          sidePanel.classList.toggle('collapsed');
        }
      });
    }
    if (closeBtn && sidePanel) {
      closeBtn.addEventListener('click', () => {
        sidePanel.classList.remove('mobile-open');
        sidePanel.classList.add('collapsed');
      });
    }

    const themeBtn = document.getElementById('theme-btn');
    if (themeBtn) {
      themeBtn.addEventListener('click', () => {
        const root = document.documentElement;
        const current = root.getAttribute('data-theme');
        const next = current === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
      });
    }
  }

  // 内嵌示例数据（?demo=1 时启用：3个部门、7名员工含 dsh×3、1条 open request、1条 decision、1条 escalation）
  const DEMO_DATA = {
    conversation: { id: "conv-demo", title: "示例：给网店做一个新的商品页" },
    gm: { kind: "claude", title: "总经理" },
    departments: [
      { id: "fe", name: "页面部", mission: "把商品页做出来", head: "rules", status: "active",
        counts: { members: 2, working: 2, open_requests: 0 },
        members: [
          { worker: "小A", agent: "codex", state: "working", now: "做商品图轮播", thread: "t-a", rounds: 3,
            tasks: [{ title: "搭好页面骨架", status: "done" }, { title: "做商品图轮播", status: "running" }, { title: "做购物车按钮", status: "queued" }] },
          { worker: "小B", agent: "dsh", state: "working", now: "写商品详情文案", thread: "t-b", rounds: 2,
            tasks: [{ title: "整理商品卖点", status: "done" }, { title: "写商品详情文案", status: "running" }] }
        ] },
      { id: "be", name: "数据部", mission: "让页面显示真实价格和库存", head: "rules", status: "active",
        counts: { members: 3, working: 1, open_requests: 1 },
        members: [
          { worker: "小C", agent: "dsh", state: "working", now: "接上库存数据", thread: "t-c", rounds: 4,
            tasks: [{ title: "读懂现有价格表", status: "done" }, { title: "接上库存数据", status: "running" }] },
          { worker: "小D", agent: "dsh", state: "waiting", now: "排队等名额：算运费", thread: "t-d", rounds: 1,
            tasks: [{ title: "算运费", status: "queued" }] },
          { worker: "小E", agent: "agy", state: "blocked", now: "等页面部确认：价格要不要含税", thread: "t-e", rounds: 2,
            tasks: [{ title: "设计价格显示规则", status: "done" }, { title: "确认价格要不要含税", status: "running" }] }
        ] },
      { id: "qa", name: "验收部", mission: "在手机和电脑上把页面挨个点一遍", head: "claude", status: "active",
        counts: { members: 2, working: 0, open_requests: 0 },
        members: [
          { worker: "小F", agent: "codex", state: "failed", now: "手机上检查：图片没对齐", thread: "t-f", rounds: 2,
            tasks: [{ title: "电脑上检查", status: "done" }, { title: "手机上检查", status: "failed" }] },
          { worker: "小G", agent: "agy", state: "sleeping", now: "检查完了，等新活", thread: "t-g", rounds: 3,
            tasks: [{ title: "检查页面能不能打开", status: "done" }, { title: "检查明暗两种颜色", status: "done" }] }
        ] }
    ],
    unassigned: [],
    messages: [
      { id: "m1", ts: Math.floor(Date.now() / 1000) - 900, from: { dept: "be", worker: "小C" }, to: "fe", type: "decision", reply_to: "m0", verdict: "accept",
        subject: "同意：价格统一显示两位小数", body: "数据部这边按两位小数给，页面直接显示就行。", status: "closed", delivered: true },
      { id: "m2", ts: Math.floor(Date.now() / 1000) - 360, from: { dept: "be", worker: "小E" }, to: "fe", type: "request",
        subject: "价格要不要含税？", body: "页面上显示的价格是含税价还是不含税价？定了我才能继续。", status: "open", delivered: false },
      { id: "m3", ts: Math.floor(Date.now() / 1000) - 120, from: { dept: "qa", worker: "小F" }, to: "gm", type: "escalation",
        subject: "手机上图片没对齐，要不要先上线？", body: "电脑上没问题，手机上商品图偏了一点。是先上线还是修好再上？请总经理定。", status: "open", delivered: true }
    ],
    contracts: [],
    plan: [
      { id: "p1", title: "搭好页面骨架", worker: "小A", agent: "codex", dept: "fe", status: "done" },
      { id: "p2", title: "做商品图轮播", worker: "小A", agent: "codex", dept: "fe", status: "running" },
      { id: "p3", title: "写商品详情文案", worker: "小B", agent: "dsh", dept: "fe", status: "running" },
      { id: "p4", title: "接上库存数据", worker: "小C", agent: "dsh", dept: "be", status: "running" },
      { id: "p5", title: "算运费", worker: "小D", agent: "dsh", dept: "be", status: "queued" },
      { id: "p6", title: "确认价格要不要含税", worker: "小E", agent: "agy", dept: "be", status: "running" },
      { id: "p7", title: "手机上检查", worker: "小F", agent: "codex", dept: "qa", status: "failed" },
      { id: "p8", title: "检查明暗两种颜色", worker: "小G", agent: "agy", dept: "qa", status: "done" }
    ]
  };

  let currentData = null;
  let reloadTimer = null;
  let prevSeen = null;   // 上一次的 { states: key→state, delivered: 消息id→是否送达 }

  function memberKeys(data) {
    const out = {};
    (data.departments || []).forEach(d => (d.members || []).forEach(m => { out[(d.id || '') + '/' + (m.worker || '')] = m; }));
    (data.unassigned || []).forEach(m => { out['unassigned/' + (m.worker || '')] = m; });
    return out;
  }
  function workerKey(data, who) {
    if (!who) return null;
    if (who === 'gm' || who.worker === 'gm' || who.dept === 'gm') return 'gm';
    const keys = memberKeys(data);
    if (who.dept && keys[who.dept + '/' + who.worker]) return who.dept + '/' + who.worker;
    return Object.keys(keys).find(k => k.endsWith('/' + who.worker)) || null;
  }
  // 消息新送达 → 收发双方说话 2 秒；working 变成 idle（成功做完）→ 庆祝 2 秒
  function detectTransients(data) {
    const members = memberKeys(data);
    const seen = { states: {}, delivered: {} };
    Object.keys(members).forEach(k => { seen.states[k] = members[k].state || 'idle'; });
    (data.messages || []).forEach(m => { seen.delivered[m.id] = !!m.delivered; });
    const prev = prevSeen;
    prevSeen = seen;
    if (!prev) return [];
    const out = [];
    Object.keys(seen.states).forEach(k => {
      if (prev.states[k] === 'working' && seen.states[k] === 'idle') out.push([k, 'celebrate']);
    });
    (data.messages || []).forEach(m => {
      if (m.type === 'delivered' || !m.delivered || prev.delivered[m.id]) return;
      const to = m.to_worker ? { dept: m.to, worker: m.to_worker } : (m.to === 'gm' ? 'gm' : null);
      const fromKey = workerKey(data, m.from), toKey = workerKey(data, to) || (m.to ? 'dept:' + m.to : null);
      [fromKey, toKey].forEach(k => { if (k) out.push([k, 'talking']); });
      if (fromKey && toKey) out.push([fromKey, 'fly', toKey, m.type]);
    });
    return out;
  }

  // 渲染整页
  function renderAll(data) {
    if (!data) return;
    currentData = data;
    if (data.gm && !data.gm.state) {
      const anyWorking = Object.values(memberKeys(data)).some(m => m.state === 'working');
      data.gm.state = anyWorking ? 'working' : 'idle';
    }
    buildRoster(data);
    const flashes = hasChars() ? detectTransients(data) : [];

    const conv = data.conversation || {};
    const convId = conv.id || '';

    updateTopStats(data);
    renderGmZone(data.gm, convId);
    renderDepartments(data.departments, data.unassigned, convId);
    renderBusMessages(data.messages);
    renderPlanTree(data.plan, data.departments);
    if (hasChars()) {
      flashes.forEach(([key, state]) => { if (state !== 'fly') flash(key, state); });
      syncChars();
    }
    // 动画片效果：等布局稳定后再飞信、撒彩带
    setTimeout(() => {
      let delay = 0;
      flashes.forEach(([key, state, toKey, type]) => {
        if (state === 'fly') { setTimeout(() => flyLetter(key, toKey, type), delay); delay += 350; }
        else if (state === 'celebrate') confetti(key);
      });
    }, 60);

    // 等待 DOM 布局绘制完成后渲染弧线
    (window.requestAnimationFrame || window.setTimeout)(() => {
      renderArcs(data.messages);
    }, 16);
  }

  // 加载数据
  async function loadData() {
    const params = new URLSearchParams(window.location.search);
    const isDemo = params.get('demo') === '1';

    if (isDemo) {
      renderAll(DEMO_DATA);
      if (!demoTimer) demoTimer = setInterval(demoTick, 4000);
      return;
    }

    const convId = params.get('conversation') || '';
    const apiUrl = '/api/org' + (convId ? `?conversation=${encodeURIComponent(convId)}` : '');

    try {
      const res = await fetch(apiUrl);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      renderAll(data);
    } catch (err) {
      console.warn('读取真实组织数据失败，降级展示示例数据:', err);
      renderAll(DEMO_DATA);
    }
  }

  // 示例模式的"假动态"：干完活庆祝、开工、送达消息、换状态，走和真实数据一样的渲染路径
  let demoTimer = null, demoSeq = 2000;
  const DEMO_JOBS = ['做优惠券弹窗', '检查手机上的按钮', '补上商品评价区', '把图片压小一点', '写退货说明', '调好页面配色', '核对库存数字'];
  const DEMO_NOTES = ['这部分做完了，你接着检查一下', '能把最新的设计图发我吗？', '按钮颜色我改好了，看看行不行', '库存数字对上了', '这里我卡住了，帮我看一眼'];
  function demoTick() {
    const data = JSON.parse(JSON.stringify(currentData || DEMO_DATA));
    if (data.gm) delete data.gm.state;
    const all = [];
    (data.departments || []).forEach(d => (d.members || []).forEach(m => all.push([d, m])));
    if (!all.length) return;
    const [dept, m] = all[Math.floor(Math.random() * all.length)];
    const pick = list => list[Math.floor(Math.random() * list.length)];
    const setPlan = (title, status) => {
      const row = (data.plan || []).find(p => p.worker === m.worker && p.title === title);
      if (row) row.status = status;
      else (data.plan = data.plan || []).push({ id: 'p' + (++demoSeq), title, worker: m.worker, agent: m.agent, dept: dept.id, status });
    };
    m.tasks = m.tasks || [];
    const running = m.tasks.find(t => t.status === 'running');
    const roll = Math.random();
    if (roll < 0.3) {
      const [od, om] = pick(all);
      data.messages = (data.messages || []).concat([{
        id: 'm_demo_' + (++demoSeq), ts: Math.floor(Date.now() / 1000), from: { dept: dept.id, worker: m.worker },
        ...(Math.random() < 0.3 ? { to: 'gm' } : { to: od.id, to_worker: om.worker }), type: 'tell',
        subject: pick(DEMO_NOTES), body: '', status: 'closed', delivered: true
      }]).slice(-12);
    } else if (m.state === 'working' && running) {
      running.status = 'done'; setPlan(running.title, 'done');
      m.state = 'idle'; m.now = '刚做完：' + running.title;
    } else {
      const job = pick(DEMO_JOBS);
      m.tasks.push({ title: job, status: 'running' }); m.tasks = m.tasks.slice(-6);
      setPlan(job, 'running');
      m.state = 'working'; m.now = job;
    }
    renderAll(data);
  }

  // 防抖 1 秒触发重新拉取
  function debouncedReload() {
    clearTimeout(reloadTimer);
    reloadTimer = setTimeout(() => {
      loadData();
    }, 1000);
  }

  // 初始化 SSE 事件监听（org.changed 事件）
  function setupSSE() {
    const params = new URLSearchParams(window.location.search);
    if (params.get('demo') === '1') return;

    const convId = params.get('conversation') || '';
    const sseUrl = '/api/events' + (convId ? `?conversation=${encodeURIComponent(convId)}` : '');

    try {
      const es = new EventSource(sseUrl);
      es.addEventListener('org.changed', () => {
        debouncedReload();
      });
      es.onerror = () => {
        // EventSource 会自动尝试重连
      };
    } catch (e) {
      console.warn('SSE 连接异常:', e);
    }
  }

  // 初始化入口
  function init() {
    setupSidePanelEvents();

    window.addEventListener('resize', () => {
      if (currentData) {
        renderArcs(currentData.messages);
      }
    });

    loadData();
    setupSSE();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  window.XayOrg = {
    flyLetter,
    confetti,
    whoIs,
    avatarHtml,
    getAgentType,
    renderCharacterSvg,
    renderDeskSvg,
    renderStationCard,
    renderGmZone,
    renderDepartments,
    renderArcs,
    renderBusMessages,
    renderPlanTree,
    selectMessage,
    updateTopStats,
    loadData,
    DEMO_DATA
  };
})();
</script>
