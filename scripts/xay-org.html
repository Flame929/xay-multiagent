<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>xay 组织架构 · 公司</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230F1115'/%3E%3Ccircle cx='10' cy='16' r='3' fill='%2310A37F'/%3E%3Ccircle cx='22' cy='16' r='3' fill='%234D6BFE'/%3E%3C/svg%3E">
<style>
/* ===== 视觉 token（沿用 xay-watch.html 与 ui-v4） ===== */
:root {
  --bg-base: #F5F7FA; --bg-sidebar: #FFFFFF; --bg-layer-1: #FFFFFF; --bg-layer-2: #FFFFFF; --bg-module: #F0F3F7;
  --bg-floor: #FFFFFF; --bg-floor-alt: #F8FAFC;
  --bg-hover: rgba(38,49,72,.06); --bg-active: rgba(38,49,72,.10);
  --label-1: #0F1115; --label-2: #61666B; --label-3: #81858C; --label-4: #ADB2B8;
  --border-1: rgba(0,0,0,.05); --border-2: rgba(0,0,0,.09); --border-3: rgba(0,0,0,.14); --border-4: rgba(0,0,0,.20);
  --brand: #0F1115; --brand-text: #FFFFFF; --accent: #4176E6;
  --ok: #22C55E; --ok-bg: #E6FAED; --err: #EC1313; --err-bg: #FEE2E2;
  --warn: #F59E0B; --warn-label: #DD8629; --warn-bg: #FEF5E7; --idle: #CFD3D6;
  --ai-codex: #10A37F; --ai-dsh: #4D6BFE; --ai-agy: #9B72CB; --ai-gm: #E07A5F; --ai-other: #81858C;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.05);
  --shadow-md: 0 4px 12px rgba(0,0,0,.08);
  --sans: -apple-system, "PingFang SC", system-ui, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg-base: #121315; --bg-sidebar: #1A1B1E; --bg-layer-1: #1E2024; --bg-layer-2: #26282E; --bg-module: #2C2F36;
    --bg-floor: #1A1B1E; --bg-floor-alt: #22242A;
    --bg-hover: rgba(255,255,255,.07); --bg-active: rgba(255,255,255,.12);
    --label-1: #F1F3F5; --label-2: #ADB2B8; --label-3: #979DA6; --label-4: #61666B;
    --border-1: rgba(255,255,255,.07); --border-2: rgba(255,255,255,.12); --border-3: rgba(255,255,255,.18); --border-4: rgba(255,255,255,.24);
    --brand: #F9FAFB; --brand-text: #0F1115;
    --ok-bg: #1B3524; --err-bg: #4A1212; --warn-bg: #3B2A14; --idle: #5A5E66;
    --ai-codex: #1CB891; --ai-dsh: #627EFE; --ai-agy: #AB86D8; --ai-gm: #F28C6E;
    --shadow-sm: 0 1px 3px rgba(0,0,0,.3);
    --shadow-md: 0 4px 14px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"] {
  --bg-base: #121315; --bg-sidebar: #1A1B1E; --bg-layer-1: #1E2024; --bg-layer-2: #26282E; --bg-module: #2C2F36;
  --bg-floor: #1A1B1E; --bg-floor-alt: #22242A;
  --bg-hover: rgba(255,255,255,.07); --bg-active: rgba(255,255,255,.12);
  --label-1: #F1F3F5; --label-2: #ADB2B8; --label-3: #979DA6; --label-4: #61666B;
  --border-1: rgba(255,255,255,.07); --border-2: rgba(255,255,255,.12); --border-3: rgba(255,255,255,.18); --border-4: rgba(255,255,255,.24);
  --brand: #F9FAFB; --brand-text: #0F1115;
  --ok-bg: #1B3524; --err-bg: #4A1212; --warn-bg: #3B2A14; --idle: #5A5E66;
  --ai-codex: #1CB891; --ai-dsh: #627EFE; --ai-agy: #AB86D8; --ai-gm: #F28C6E;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.3);
  --shadow-md: 0 4px 14px rgba(0,0,0,.45);
}
:root[data-theme="light"] {
  --bg-base: #F5F7FA; --bg-sidebar: #FFFFFF; --bg-layer-1: #FFFFFF; --bg-layer-2: #FFFFFF; --bg-module: #F0F3F7;
  --bg-floor: #FFFFFF; --bg-floor-alt: #F8FAFC;
  --bg-hover: rgba(38,49,72,.06); --bg-active: rgba(38,49,72,.10);
  --label-1: #0F1115; --label-2: #61666B; --label-3: #81858C; --label-4: #ADB2B8;
  --border-1: rgba(0,0,0,.05); --border-2: rgba(0,0,0,.09); --border-3: rgba(0,0,0,.14); --border-4: rgba(0,0,0,.20);
  --brand: #0F1115; --brand-text: #FFFFFF;
  --ok-bg: #E6FAED; --err-bg: #FEE2E2; --warn-bg: #FEF5E7; --idle: #CFD3D6;
  --ai-codex: #10A37F; --ai-dsh: #4D6BFE; --ai-agy: #9B72CB; --ai-gm: #E07A5F;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.05);
  --shadow-md: 0 4px 12px rgba(0,0,0,.08);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; width: 100%; }
body {
  font-family: var(--sans); font-size: 14px; line-height: 1.5; color: var(--label-1);
  background: var(--bg-base); overflow: hidden; display: flex; flex-direction: column;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
.mono { font-family: var(--mono); }

/* ===== 顶部导航条 ===== */
header#top-bar {
  height: 52px; min-height: 52px; background: var(--bg-layer-1); border-bottom: 1px solid var(--border-2);
  display: flex; align-items: center; justify-content: space-between; padding: 0 16px; gap: 12px; z-index: 40;
}
.brand-group { display: flex; align-items: center; gap: 10px; min-width: 0; }
.btn-back {
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 6px;
  background: var(--bg-module); font-size: 13px; font-weight: 500; color: var(--label-2);
  border: 1px solid var(--border-1); transition: all .15s; flex-shrink: 0;
}
.btn-back:hover { background: var(--bg-hover); color: var(--label-1); }
.conv-title { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status-bar {
  display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--label-2); flex-wrap: nowrap;
}
.stat-pill {
  white-space: nowrap; flex: none;
  display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 12px;
  background: var(--bg-module); border: 1px solid var(--border-1);
}
.stat-pill b { color: var(--label-1); font-weight: 600; }
.top-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.btn-action {
  padding: 6px 10px; border-radius: 6px; font-size: 13px; color: var(--label-2);
  border: 1px solid var(--border-2); background: var(--bg-layer-1); display: inline-flex; align-items: center; gap: 5px;
}
.btn-action:hover { background: var(--bg-hover); color: var(--label-1); }

/* ===== 页面主体双栏结构 ===== */
#main-wrap { flex: 1; display: flex; position: relative; overflow: hidden; }
#office-viewport {
  flex: 1; position: relative; overflow-y: auto; overflow-x: hidden; padding: 24px;
  scroll-behavior: smooth;
}
#office-canvas {
  position: relative; max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 56px;
}

/* SVG 弧线连接层 */
svg#arc-canvas {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10;
  overflow: visible;
}
.arc-path {
  fill: none; stroke: var(--accent); stroke-width: 2.2; stroke-dasharray: 6 4; opacity: .7;
  pointer-events: stroke; cursor: pointer; transition: stroke-width .2s, opacity .2s, stroke .2s;
}
.arc-path:hover, .arc-path.highlighted { stroke-width: 4.5; opacity: 1; }
.arc-path.arc-open {
  stroke: var(--warn); stroke-width: 2.8; stroke-dasharray: 8 4; animation: arcFlow 1.6s linear infinite;
}
.arc-path.arc-escalation {
  stroke: var(--err); stroke-width: 2.8; stroke-dasharray: 6 3;
}
.arc-path.arc-decision {
  stroke: var(--ok); stroke-width: 2.2; stroke-dasharray: none; opacity: .6;
}
.arc-dot { fill: var(--warn); filter: drop-shadow(0 0 5px var(--warn)); }
@keyframes arcFlow {
  from { stroke-dashoffset: 24; }
  to { stroke-dashoffset: 0; }
}

/* 弧线悬浮卡片提示 */
#arc-tooltip {
  position: absolute; display: none; background: var(--bg-layer-2); border: 1px solid var(--border-3);
  box-shadow: var(--shadow-md); border-radius: 8px; padding: 6px 12px; font-size: 12px; color: var(--label-1);
  pointer-events: none; z-index: 50; max-width: 260px; line-height: 1.4;
}

/* 总经理区 */
#gm-zone {
  display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; z-index: 20;
}
.gm-station-box {
  background: var(--bg-layer-1); border: 1.5px solid var(--ai-gm); border-radius: 14px;
  padding: 14px 24px; display: flex; flex-direction: column; align-items: center;
  box-shadow: var(--shadow-md); position: relative; max-width: 380px; width: 100%;
  background-image: radial-gradient(var(--border-2) 1px, transparent 1px); background-size: 14px 14px;
}
.gm-badge-title {
  display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; color: var(--label-1);
}
.gm-crown-tag {
  background: var(--ai-gm); color: #FFF; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 4px;
}
.gm-mission {
  font-size: 12px; color: var(--label-2); margin-top: 4px; text-align: center;
}

/* 部门办公区网格与浅色地面 */
#dept-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); column-gap: 56px; row-gap: 56px; align-items: start; position: relative; z-index: 20;
}
.dept-card {
  background: var(--bg-floor); border: 1px solid var(--border-2); border-radius: 14px;
  padding: 16px; display: flex; flex-direction: column; gap: 12px; position: relative;
  box-shadow: var(--shadow-sm);
  background-image: radial-gradient(var(--border-2) 1px, transparent 1px); background-size: 16px 16px;
  transition: border-color .2s;
}
.dept-card:hover { border-color: var(--border-4); }
.dept-card.has-open-req { border-color: var(--warn); box-shadow: 0 0 0 1px var(--warn); }
.dept-header {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; border-bottom: 1px solid var(--border-1);
  padding-bottom: 8px;
}
.dept-info { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.dept-title-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.dept-name { font-size: 15px; font-weight: 700; color: var(--label-1); }
.dept-head-badge {
  font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--bg-module); color: var(--label-2);
  border: 1px solid var(--border-1);
}
.dept-head-badge.head-claude { background: var(--warn-bg); color: var(--warn-label); border-color: var(--warn); }
.dept-mission {
  font-size: 12px; color: var(--label-3); line-height: 1.4; word-break: break-word;
}
.dept-stats { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.dept-members-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px;
}
.dept-empty {
  padding: 20px; text-align: center; color: var(--label-4); font-size: 12px; border: 1px dashed var(--border-2);
  border-radius: 8px; background: var(--bg-module);
}

/* 未分配员工区 */
#unassigned-section {
  display: none; flex-direction: column; gap: 12px; margin-top: 10px; z-index: 20; position: relative;
  background: var(--bg-layer-1); border: 1px dashed var(--border-3); border-radius: 12px; padding: 14px;
}
.unassigned-title { font-size: 13px; font-weight: 600; color: var(--label-2); display: flex; align-items: center; gap: 6px; }

/* ===== 右侧面板 ===== */
#side-panel {
  width: 360px; min-width: 360px; max-width: 420px; background: var(--bg-sidebar);
  border-left: 1px solid var(--border-2); display: flex; flex-direction: column; z-index: 30;
  transition: transform .25s cubic-bezier(.16,1,.3,1), width .25s ease;
}
#side-panel.collapsed { transform: translateX(100%); position: absolute; right: 0; height: 100%; }
.panel-tabs {
  height: 44px; display: flex; border-bottom: 1px solid var(--border-2); background: var(--bg-layer-1);
}
.tab-btn {
  flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  font-size: 13px; font-weight: 500; color: var(--label-3); border-bottom: 2px solid transparent;
}
.tab-btn.active { color: var(--label-1); border-bottom-color: var(--accent); font-weight: 600; }
.tab-content { flex: 1; overflow-y: auto; padding: 14px; display: none; }
.tab-content.active { display: block; }

/* 信件栏（第八版 §4）：像聊天记录的一封封信 */
.letter { display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; position: relative; }
.letter + .letter { margin-top: 4px; }
.letter-avatar { flex: none; width: 34px; height: 34px; border-radius: 50%; overflow: hidden; background: var(--bg-module); border: 2px solid var(--border-2); display: flex; align-items: flex-start; justify-content: center; }
.letter-avatar svg.xc { flex: none; margin-top: -4px; }
.letter.is-reply .letter-avatar svg.xc { width: 40px; height: 47px; }
.letter-bubble {
  flex: 1; min-width: 0; background: var(--bg-layer-1); border: 1px solid var(--border-2); border-radius: 4px 14px 14px 14px;
  padding: 8px 10px; box-shadow: var(--shadow-sm); border-left: 3px solid var(--k-c, var(--border-3)); cursor: pointer;
  transition: border-color .15s, box-shadow .15s;
}
.letter.selected > .letter-bubble { box-shadow: 0 0 0 2px var(--accent); }
.letter.k-request { --k-c: var(--warn); } .letter.k-decision { --k-c: var(--ok); } .letter.k-escalation { --k-c: var(--err); }
.letter.k-tell { --k-c: var(--accent); } .letter.k-report { --k-c: var(--label-4); }
.letter-head { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; font-size: 11.5px; color: var(--label-2); }
.letter-head b { font-weight: 700; }
.letter-arrow { color: var(--label-4); }
.letter-kind { font-size: 10px; font-weight: 700; padding: 0 6px; border-radius: 8px; color: #fff; background: var(--k-c, var(--label-4)); }
.letter-kind.k-request { --k-c: var(--warn); } .letter-kind.k-decision { --k-c: var(--ok); } .letter-kind.k-escalation { --k-c: var(--err); }
.letter-kind.k-tell { --k-c: var(--accent); } .letter-kind.k-report { --k-c: var(--label-4); }
.letter-time { margin-left: auto; font-size: 10px; color: var(--label-4); }
.letter-subject { font-weight: 700; font-size: 13px; color: var(--label-1); margin-top: 4px; line-height: 1.4; }
.letter-body { font-size: 12px; color: var(--label-2); line-height: 1.5; margin-top: 2px; white-space: pre-wrap; word-break: break-word; }
.letter-body.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.letter-more { font-size: 11px; color: var(--accent); padding: 0; margin-top: 2px; }
.letter-answer { margin-top: 6px; padding: 6px 8px; border-radius: 8px; background: var(--ok-bg); font-size: 12px; color: var(--label-1); line-height: 1.45; }
.letter-foot { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
.letter-foot:empty { display: none; }
.letter-chip { font-size: 10px; padding: 1px 6px; border-radius: 8px; background: var(--bg-module); color: var(--label-3); display: inline-flex; align-items: center; gap: 2px; }
.letter-chip.chip-wait { background: var(--warn-bg); color: var(--warn-label); font-weight: 700; }
.letter-chip.chip-ok, .letter-chip.chip-sent { background: var(--ok-bg); color: var(--ok); }
.letter-chip.chip-err { background: var(--err-bg); color: var(--err); }
.letter-chip.chip-going { background: var(--warn-bg); color: var(--warn-label); }
.letter-chip .hourglass { display: inline-block; animation: hourglassSpin 2.5s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
.letter-replies { flex-basis: 100%; margin: 6px 0 0 16px; padding-left: 14px; border-left: 2px dashed var(--border-3); display: flex; flex-direction: column; gap: 6px; }
.letter.is-reply .letter-avatar { width: 28px; height: 28px; }
.letter-new { animation: letterIn .45s cubic-bezier(.2,.8,.3,1.2); }
@keyframes letterIn { from { opacity: 0; transform: translateY(14px) scale(.97); } to { opacity: 1; transform: none; } }
.flash-ping { animation: flashPing 1.2s ease-out; }
@keyframes flashPing { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 70%, transparent); } 70% { box-shadow: 0 0 0 14px transparent; } 100% { box-shadow: none; } }
@media (prefers-reduced-motion: reduce) { .letter-new, .flash-ping, .letter-chip .hourglass { animation: none !important; } }

/* 任务拆解 plan 树卡片 */
.plan-item-card {
  background: var(--bg-layer-1); border: 1px solid var(--border-2); border-left: 3px solid var(--accent);
  border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 5px; font-size: 12px;
}
.plan-item-title { font-weight: 600; font-size: 13px; color: var(--label-1); display: flex; align-items: center; gap: 6px; }
.plan-dept-pill { font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 10px; color: #FFF; }
.plan-deps { font-size: 11px; color: var(--label-3); display: flex; align-items: center; gap: 4px; }

/* ===== 工位卡片与原创角色样式 ===== */
.station-card {
  background: var(--bg-layer-1); border: 1px solid var(--border-2); border-radius: 12px;
  padding: 12px 10px 10px; display: flex; flex-direction: column; align-items: center;
  position: relative; transition: all .2s ease; cursor: pointer; text-decoration: none;
  box-shadow: var(--shadow-sm); user-select: none;
}
.station-card:hover {
  transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: var(--accent);
}
.station-svg-wrap { width: 140px; height: 105px; position: relative; }
.station-meta { margin-top: 6px; text-align: center; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.station-name-row { display: flex; align-items: center; justify-content: center; gap: 6px; max-width: 100%; }
.station-worker-name { font-size: 13px; font-weight: 600; color: var(--label-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.agent-tag {
  font-size: 10px; font-weight: 700; text-transform: uppercase; padding: 1px 5px; border-radius: 4px;
  color: #FFFFFF; letter-spacing: 0.5px;
}
.agent-tag.tag-codex { background: var(--ai-codex); }
.agent-tag.tag-dsh { background: var(--ai-dsh); }
.agent-tag.tag-agy { background: var(--ai-agy); }
.agent-tag.tag-claude, .agent-tag.tag-gm { background: var(--ai-gm); }
.agent-tag.tag-other { background: var(--ai-other); }

.station-now-text {
  font-size: 11px; color: var(--label-3); line-height: 1.3; max-width: 140px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center;
}
.station-state-badge {
  position: absolute; top: 8px; left: 8px; font-size: 10px; font-weight: 600; padding: 1px 6px;
  border-radius: 8px; border: 1px solid transparent; display: flex; align-items: center; gap: 4px;
}
.state-working { background: var(--ok-bg); color: var(--ok); border-color: var(--ok); }
.state-sleeping { background: var(--bg-module); color: var(--label-4); }
.state-blocked { background: var(--err-bg); color: var(--err); border-color: var(--err); }
.state-failed { background: var(--err-bg); color: var(--err); font-weight: bold; }
.state-waiting { background: var(--warn-bg); color: var(--warn); }
.state-idle { background: var(--bg-module); color: var(--label-3); }

/* SVG 动画与图元关键帧 */
@keyframes codeScroll { 0% { transform: translateY(0); } 100% { transform: translateY(-20px); } }
@keyframes typingMotion { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
@keyframes floatZzz {
  0% { transform: translate(0, 0) scale(0.8); opacity: 0; }
  40% { opacity: 0.9; }
  100% { transform: translate(8px, -14px) scale(1.1); opacity: 0; }
}
@keyframes pulseQuestion {
  0%, 100% { transform: scale(1) translateY(0); }
  50% { transform: scale(1.15) translateY(-3px); }
}
@keyframes hourglassSpin {
  0%, 40% { transform: rotate(0deg); }
  50%, 90% { transform: rotate(180deg); }
  100% { transform: rotate(360deg); }
}
@keyframes redMonitorPulse {
  0%, 100% { fill: #4A1212; stroke: #EC1313; }
  50% { fill: #7F1D1D; stroke: #F87171; }
}

.anim-scroll-lines { animation: codeScroll 1.6s linear infinite; }
.anim-typing { animation: typingMotion 0.6s ease-in-out infinite; transform-origin: center; }
.anim-zzz { animation: floatZzz 2.2s cubic-bezier(0.2, 0.8, 0.3, 1) infinite; }
.anim-zzz-2 { animation: floatZzz 2.2s cubic-bezier(0.2, 0.8, 0.3, 1) 1.1s infinite; }
.anim-question { animation: pulseQuestion 1.4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
.anim-hourglass { animation: hourglassSpin 2.5s cubic-bezier(0.4, 0, 0.2, 1) infinite; transform-origin: center; transform-box: fill-box; }
.anim-red-monitor { animation: redMonitorPulse 1.2s infinite; }

/* ===== 第八版：部门房间、监工席、组织树、写信动画、进度条（ui-v8-org-cartoon.md）===== */
:root { --line: #CDD4DD; --line-glow: #4176E6; }
:root[data-theme="dark"] { --line: #3B414B; --line-glow: #7FA4FF; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --line: #3B414B; --line-glow: #7FA4FF; } }

/* 总经理：只留名字和角色 */
.gm-station-box {
  background: var(--bg-layer-1); background-image: none; border: 1px solid color-mix(in srgb, var(--ai-gm) 35%, transparent);
  border-radius: 24px; padding: 14px 28px 8px; max-width: 320px; gap: 0;
  box-shadow: 0 14px 34px -16px color-mix(in srgb, var(--ai-gm) 55%, transparent);
}
.gm-name { display: inline-flex; align-items: center; gap: 7px; font-size: 15px; font-weight: 700; color: var(--label-1); }
.gm-name::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ai-gm); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ai-gm) 22%, transparent); }
.gm-desk-wrap { width: 230px; height: 152px; margin-top: 4px; }

/* 部门房间：浅色底 + 柔和投影，不要粗边和装饰 */
.dept-card.room {
  padding: 0; gap: 0; border-radius: 24px; background-image: none;
  border: 1px solid color-mix(in srgb, var(--room-c) 22%, transparent);
  background: color-mix(in srgb, var(--room-c) 5%, var(--bg-layer-1));
  box-shadow: 0 16px 36px -20px color-mix(in srgb, var(--room-c) 50%, transparent);
  transition: box-shadow .25s, transform .25s;
}
.dept-card.room:hover { border-color: color-mix(in srgb, var(--room-c) 40%, transparent); transform: translateY(-2px); }
.room-head { display: flex; align-items: center; gap: 10px; padding: 16px 18px 2px; }
.room-name { display: inline-flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700; color: var(--label-1); letter-spacing: .3px; }
.room-name::before { content: ""; width: 10px; height: 10px; border-radius: 4px; background: var(--room-c); }
.room-pill { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 10px; background: color-mix(in srgb, var(--room-c) 10%, transparent); color: color-mix(in srgb, var(--room-c) 80%, var(--label-1)); }
.room-pill.warn { background: var(--warn-bg); color: var(--warn-label); }
.room-pill .live { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); margin-right: 4px; vertical-align: 1px; animation: livePulse 1.6s ease-in-out infinite; }
@keyframes livePulse { 50% { opacity: .35; transform: scale(.7); } }
.room-floor { display: flex; gap: 12px; padding: 14px 18px 18px; align-items: flex-start; }
.room-staff { flex: 1; min-width: 0; }
.head-desk {
  flex: none; width: 84px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 4px 8px;
  border-radius: 16px; background: color-mix(in srgb, var(--room-c) 9%, var(--bg-layer-1));
}
.head-desk .head-title { font-size: 11px; font-weight: 700; color: color-mix(in srgb, var(--room-c) 75%, var(--label-1)); }
.head-desk svg.xc { display: block; }
.robot { display: block; animation: robotBob 2.4s ease-in-out infinite; }
.robot .robot-eyes { transform-origin: 30px 25px; animation: robotBlink 4s infinite; }
.room.busy .robot-bulb { animation: bulbBlink 1s steps(2, end) infinite; }
@keyframes robotBob { 50% { transform: translateY(-2px); } }
@keyframes robotBlink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
@keyframes bulbBlink { 50% { fill: #fde68a; } }

/* 工位：干净的白卡片 */
.station-card { border: 1px solid var(--border-1); border-radius: 18px; padding: 10px 10px 12px; box-shadow: 0 6px 18px -12px rgba(15,17,21,.35); }
.station-card:hover { transform: translateY(-3px); border-color: var(--border-2); box-shadow: 0 14px 26px -14px rgba(15,17,21,.4); }
.station-state-badge { border: none; padding: 2px 8px; border-radius: 10px; font-weight: 700; }
.station-state-badge .dot { display: none; }
.station-worker-name { font-size: 13.5px; font-weight: 700; }
.station-progress { width: 104px; height: 4px; border-radius: 4px; background: var(--bg-module); overflow: hidden; margin-top: 6px; }
.station-progress > i { display: block; height: 100%; width: 100%; border-radius: 4px; }
.station-progress.p-working > i {
  background: linear-gradient(90deg, transparent 0%, var(--ok) 35%, color-mix(in srgb, var(--ok) 40%, #fff) 50%, var(--ok) 65%, transparent 100%);
  background-size: 200% 100%; animation: progSweep 1.4s linear infinite;
}
.station-progress.p-idle > i { background: color-mix(in srgb, var(--ok) 45%, transparent); }
.station-progress.p-failed > i { background: var(--err); }
.station-progress.p-blocked > i { background: var(--warn); }
.station-progress.p-waiting > i { background: var(--warn); width: 30%; animation: progWait 1.6s ease-in-out infinite alternate; }
.station-progress.p-sleeping > i { background: var(--idle); }
@keyframes progSweep { from { background-position: 100% 0; } to { background-position: -100% 0; } }
@keyframes progWait { to { transform: translateX(233%); } }
.name-codex { color: var(--ai-codex); } .name-dsh { color: var(--ai-dsh); } .name-agy { color: var(--ai-agy); } .name-gm { color: var(--ai-gm); }

/* 组织树：细线 + 圆角拐弯；有人干活的部门，一颗光点沿线往下走 */
.org-line { fill: none; stroke: var(--line); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.org-node { fill: var(--bg-base); stroke: var(--line); stroke-width: 2; }
.org-branch { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; opacity: .55; }
.org-flow { fill: none; stroke-width: 3.5; stroke-linecap: round; stroke-dasharray: 0 99999; filter: drop-shadow(0 0 5px currentColor); }
.room-progress { width: 64px; height: 6px; border-radius: 6px; background: color-mix(in srgb, var(--room-c) 14%, transparent); overflow: hidden; margin-left: auto; }
.room-progress > i { display: block; height: 100%; border-radius: 6px; background: var(--room-c); transition: width .6s cubic-bezier(.2,.8,.3,1); }
.room-progress-text { font-size: 11px; font-weight: 700; color: var(--label-3); font-variant-numeric: tabular-nums; }
/* 每个人的任务清单 */
.todo { list-style: none; width: 100%; margin: 6px 0 0; padding: 0 2px; display: flex; flex-direction: column; gap: 3px; text-align: left; }
.todo li { display: flex; align-items: center; gap: 6px; font-size: 11.5px; line-height: 1.35; color: var(--label-2); min-width: 0; }
.todo li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.todo li i { flex: none; width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid var(--label-4); position: relative; }
.todo li.todo-done { color: var(--label-3); }
.todo li.todo-done i { background: var(--ok); border-color: var(--ok); }
.todo li.todo-done i::after { content: ""; position: absolute; left: 3.5px; top: 1px; width: 3px; height: 6px; border: solid #fff; border-width: 0 1.6px 1.6px 0; transform: rotate(45deg); }
.todo li.todo-running { color: var(--label-1); font-weight: 600; }
.todo li.todo-running i { border-color: color-mix(in srgb, var(--accent) 25%, transparent); border-top-color: var(--accent); animation: todoSpin .9s linear infinite; }
.todo li.todo-failed { color: var(--err); }
.todo li.todo-failed i { background: var(--err); border-color: var(--err); }
.todo li.todo-failed i::after { content: "×"; position: absolute; inset: -3px 0 0; color: #fff; font-size: 11px; font-weight: 800; text-align: center; line-height: 14px; }
.todo li.todo-queued i { border-style: dashed; }
.todo li.todo-more, .todo li.todo-idle { color: var(--label-4); font-size: 10.5px; }
.todo li.todo-more { padding-left: 19px; }
@keyframes todoSpin { to { transform: rotate(360deg); } }
/* 任务拆解：任务 → 谁在做 */
.plan-summary { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.plan-group { margin-bottom: 14px; }
.plan-group-title { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--label-2); margin-bottom: 6px; }
.plan-group-title::before { content: ""; width: 8px; height: 8px; border-radius: 3px; background: var(--g-c, var(--label-4)); }
.plan-row { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 12px; background: var(--bg-layer-1); border: 1px solid var(--border-1); margin-bottom: 5px; }
.plan-row .plan-ava { flex: none; width: 30px; height: 30px; border-radius: 50%; overflow: hidden; display: flex; justify-content: center; background: var(--bg-module); }
.plan-row .plan-ava svg.xc { flex: none; margin-top: -3px; }
.plan-row .plan-main { flex: 1; min-width: 0; }
.plan-row .plan-title { font-size: 12.5px; font-weight: 600; color: var(--label-1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.plan-row .plan-who { font-size: 11px; color: var(--label-3); }
.plan-state { flex: none; font-size: 10.5px; font-weight: 700; padding: 1px 7px; border-radius: 9px; background: var(--bg-module); color: var(--label-3); }
.plan-state.s-done { background: var(--ok-bg); color: var(--ok); }
.plan-state.s-running { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
.plan-state.s-failed { background: var(--err-bg); color: var(--err); }
.plan-state.s-queued { background: var(--warn-bg); color: var(--warn-label); }

/* 写信飞行、落地牌子、彩带 */
.letter-fly { position: absolute; left: 0; top: 0; z-index: 60; pointer-events: none; width: 30px; height: 22px; margin: -11px 0 0 -15px; filter: drop-shadow(0 4px 6px rgba(0,0,0,.22)); }
.land-ping {
  position: absolute; z-index: 61; pointer-events: none; font-size: 11px; font-weight: 700; color: #fff; padding: 3px 9px; border-radius: 12px;
  transform: translate(-50%, -100%); animation: landPop 1.4s ease-out forwards; white-space: nowrap; box-shadow: 0 6px 14px -6px rgba(0,0,0,.35);
}
@keyframes landPop { 0% { opacity: 0; transform: translate(-50%, -60%) scale(.6); } 20% { opacity: 1; transform: translate(-50%, -120%) scale(1.06); } 80% { opacity: 1; transform: translate(-50%, -140%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -170%); } }
.confetti { position: absolute; z-index: 62; width: 7px; height: 10px; border-radius: 2px; pointer-events: none; }
@media (prefers-reduced-motion: reduce) {
  .robot, .robot .robot-eyes, .org-flow, .station-progress > i, .room-pill .live { animation: none !important; }
  .org-flow { display: none; }
  .todo li.todo-running i { animation: none !important; }
}
@media (max-width: 560px) {
  .room-floor { flex-direction: column; align-items: stretch; }
  .head-desk { width: auto; align-self: flex-start; flex-direction: row; gap: 6px; padding: 3px 12px 3px 6px; border-radius: 14px; }
  .head-desk svg { width: 30px !important; height: auto !important; }
  .room-staff { width: 100%; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .room-staff .station-svg-wrap { width: 100%; height: auto; aspect-ratio: 140 / 105; }
  .room-staff .station-progress { width: 80%; }
  .gm-desk-wrap { width: 190px; height: 126px; }
}

/* 响应式：手机端适配 390px */
@media (max-width: 768px) {
  header#top-bar { padding: 0 10px; height: 48px; }
  .conv-title { max-width: 120px; }
  .status-bar .stat-hide-sm { display: none; }
}
@media (max-width: 560px) {
  .status-bar { display: none; }
  #office-viewport { padding: 12px; }
  #dept-grid { grid-template-columns: 1fr; gap: 40px; padding-left: 18px; }
  #side-panel {
    position: fixed; top: 52px; bottom: 0; right: 0; width: 100%; max-width: 100%;
    transform: translateX(100%); box-shadow: -4px 0 20px rgba(0,0,0,.25);
  }
  #side-panel.mobile-open { transform: translateX(0); }
}
</style>
</head>
<body>

<header id="top-bar">
  <div class="brand-group">
    <a href="/" id="back-link" class="btn-back" title="返回主看板">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path fill-rule="evenodd" d="M9.78 12.78a.75.75 0 0 1-1.06 0L4.47 8.53a.75.75 0 0 1 0-1.06l4.25-4.25a.75.75 0 0 1 1.06 1.06L6.06 8l3.72 3.72a.75.75 0 0 1 0 1.06z"/></svg>
      <span>看板</span>
    </a>
    <div class="conv-title" id="bar-title">AI 公司组织架构</div>
  </div>
  <div class="status-bar" id="bar-stats">
    <span class="stat-pill"><span class="dot" style="background:var(--accent);"></span> <b id="stat-depts">0</b> 部门</span>
    <span class="stat-pill"><span class="dot ok"></span> <b id="stat-workers">0</b> 员工在岗</span>
    <span class="stat-pill stat-hide-sm" id="stat-req-box"><span class="dot warn"></span> <b id="stat-requests">0</b> 待答需求</span>
  </div>
  <div class="top-actions">
    <button class="btn-action" id="theme-btn" title="切换明暗主题">🌓</button>
    <button class="btn-action" id="panel-toggle-btn" title="展开/收起侧边栏">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M2 3.75C2 2.784 2.784 2 3.75 2h8.5c.966 0 1.75.784 1.75 1.75v8.5A1.75 1.75 0 0 1 12.25 14h-8.5A1.75 1.75 0 0 1 2 12.25v-8.5zm8.5-.25v9h1.75a.25.25 0 0 0 .25-.25v-8.5a.25.25 0 0 0-.25-.25h-1.75z"/></svg>
      <span class="stat-hide-sm">记录与规划</span>
    </button>
  </div>
</header>

<div id="main-wrap">
  <div id="office-viewport">
    <div id="office-canvas">
      <svg id="arc-canvas"></svg>
      <div id="arc-tooltip"></div>

      <!-- 总经理工位 -->
      <section id="gm-zone" aria-label="总经理办公室"></section>

      <!-- 各部门办公区 -->
      <section id="dept-grid" aria-label="部门办公区"></section>

      <!-- 未分配员工区 -->
      <section id="unassigned-section" aria-label="待分配工位"></section>
    </div>
  </div>

  <!-- 右侧任务拆解与沟通记录面板 -->
  <aside id="side-panel">
    <div class="panel-tabs">
      <button class="tab-btn active" data-tab="bus">
        <span>信件</span>
        <span class="stat-pill" style="padding:1px 6px;font-size:11px;" id="bus-count">0</span>
      </button>
      <button class="tab-btn" data-tab="plan">
        <span>任务拆解</span>
        <span class="stat-pill" style="padding:1px 6px;font-size:11px;" id="plan-count">0</span>
      </button>
      <button class="btn-action" id="panel-close-btn" style="padding:0 12px;font-size:18px;color:var(--label-3);line-height:1;" title="关闭面板">×</button>
    </div>
    <div class="tab-content active" id="tab-bus">
      <div id="bus-list" style="display:flex;flex-direction:column;gap:10px;"></div>
    </div>
    <div class="tab-content" id="tab-plan">
      <div id="plan-list" style="display:flex;flex-direction:column;gap:10px;"></div>
    </div>
  </aside>
</div>

<script src="/xay-chars/core.js"></script>
<script src="/xay-chars/codex.js"></script>
<script src="/xay-chars/dsh.js"></script>
<script src="/xay-chars/agy.js"></script>
<script src="/xay-chars/claude.js"></script>
<script src="/xay-chars/rules.js"></script>
<script>
// xay-org.html 核心逻辑
(function() {
  'use strict';

  let _uid = 0;
  function nextId() { return 'id_' + (++_uid); }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // ===== 人员目录：员工统一显示成「AI 名 + 序号」（Codex 1、DeepSeek 2…），工位和信件栏共用 =====
  const AI_NAMES = { codex: 'Codex', dsh: 'DeepSeek', agy: 'Gemini', gm: 'Claude', other: 'AI' };
  const labelSeq = {};     // AI 类型 → 已发到几号
  const labelOf = {};      // 'dept/worker' → 'Codex 1'（发过号就不再变）
  let roster = {};         // 'dept/worker' → { key, dept, worker, agent, type, label }
  function buildRoster(data) {
    roster = {};
    const add = (deptId, m) => {
      const type = getAgentType(m.agent);
      const key = (deptId || '') + '/' + (m.worker || '');
      if (!labelOf[key]) {
        labelSeq[type] = (labelSeq[type] || 0) + 1;
        labelOf[key] = AI_NAMES[type] + ' ' + labelSeq[type];
      }
      roster[key] = { key, dept: deptId, worker: m.worker, agent: m.agent, type, label: labelOf[key] };
    };
    (data.departments || []).forEach(d => (d.members || []).forEach(m => add(d.id, m)));
    (data.unassigned || []).forEach(m => add('unassigned', m));
  }
  // who：'gm'、{ dept, worker } 或部门 id 字符串；返回 { label, type, key }，找不到时用原名
  function whoIs(who, depts) {
    if (!who || who === 'gm' || who.dept === 'gm' || who.worker === 'gm') return { key: 'gm', type: 'gm', label: '总经理' };
    if (typeof who === 'string') {
      const d = (depts || []).find(x => x.id === who);
      return { key: 'dept:' + who, type: 'dept', label: d ? (d.name || who) : who };
    }
    const hit = roster[(who.dept || '') + '/' + (who.worker || '')] ||
      Object.values(roster).find(r => r.worker === who.worker);
    return hit || { key: 'x:' + who.worker, type: 'other', label: who.worker || '某人' };
  }
  function humanize(text) {
    let out = String(text || '');
    Object.values(roster).forEach(r => { if (r.worker && r.worker.length >= 2 && r.worker !== r.label) out = out.split(r.worker).join(r.label); });
    return out;
  }
  // 小头像（信件栏、监工席用）：有角色脚本就用角色，否则用 AI 色块圆点
  function avatarHtml(type, size, state) {
    if (hasChars() && type !== 'dept' && type !== 'other') {
      return XayChars.render(type === 'gm' ? 'claude' : type, { state: state || 'idle', size: size || 28 });
    }
    return `<span class="avatar-dot tag-${type}" style="width:${size || 28}px;height:${size || 28}px;"></span>`;
  }

  function getAgentType(agent) {
    const a = (agent || '').toLowerCase();
    if (a.includes('codex')) return 'codex';
    if (a.includes('dsh') || a.includes('deepseek')) return 'dsh';
    if (a.includes('agy') || a.includes('antigravity') || a.includes('gemini')) return 'agy';
    if (a.includes('claude') || a.includes('gm')) return 'gm';
    return 'other';
  }

  // 原创几何小角色 SVG（Codex 黑绿、dsh 蓝、agy 紫、GM 暖橙；纯原创几何形状）
  function renderCharacterSvg(agentType, state) {
    const isTyping = state === 'working';
    const typingCls = isTyping ? ' anim-typing' : '';

    if (agentType === 'codex') {
      // Codex: 方角赛博终端体，黑绿配色，单眼发光感光带，机械耳麦
      return `
        <g class="${typingCls}" transform-origin="108 42">
          <!-- 机械耳麦/天线 -->
          <line x1="108" y1="23" x2="108" y2="16" stroke="#10A37F" stroke-width="2"/>
          <circle cx="108" cy="15" r="2.5" fill="#10A37F"/>
          <!-- 方角头部 -->
          <rect x="94" y="23" width="28" height="24" rx="4" fill="#18231E" stroke="#10A37F" stroke-width="2"/>
          <!-- 绿色感光单眼 -->
          <rect x="98" y="32" width="20" height="6" rx="2" fill="#10A37F"/>
          <circle cx="104" cy="35" r="1.5" fill="#E6FAED"/>
          <!-- 身体躯干与双臂 -->
          <path d="M96 47 L120 47 L124 66 L92 66 Z" fill="#202F28"/>
          <!-- 敲键小手 -->
          <circle cx="93" cy="67" r="3" fill="#10A37F"/>
          <circle cx="123" cy="67" r="3" fill="#10A37F"/>
        </g>`;
    } else if (agentType === 'dsh') {
      // dsh: 蔚蓝流线飞行机器人，圆角盾形头部，发光蓝眸与侧翼
      return `
        <g class="${typingCls}" transform-origin="108 42">
          <!-- 动能侧翼 -->
          <polygon points="94,34 88,28 92,38" fill="#4D6BFE"/>
          <polygon points="122,34 128,28 124,38" fill="#4D6BFE"/>
          <!-- 椭圆头部 -->
          <ellipse cx="108" cy="34" rx="14" ry="12" fill="#171F36" stroke="#4D6BFE" stroke-width="2"/>
          <!-- 双蓝眸 -->
          <rect x="99" y="32" width="6" height="4" rx="1.5" fill="#627EFE"/>
          <rect x="111" y="32" width="6" height="4" rx="1.5" fill="#627EFE"/>

  // ===== 第七版角色（scripts/xay-chars/，设计见 references/plans/ui-v7-characters.md §4）=====
  // 角色在工位画布（150×102）里的位置：手落在桌面上，桌子挡住下半身
  const CHAR_BOX = { x: 72, y: -2, w: 76 };
  const TRANSIENT_MS = 2000;
  const baseStates = {};   // 角色 key → 接口给的状态
  const transients = {};   // 角色 key → { state, until }：talking / celebrate 这类瞬时状态

  function hasChars() { return !!(window.XayChars && window.XayChars.render); }
  function charAgent(agentType) { return agentType === 'gm' ? 'claude' : agentType; }
  function effectiveState(key) {
    const t = transients[key];
    return t && t.until > Date.now() ? t.state : (baseStates[key] || 'idle');
  }
  function renderCharInDesk(agentType, key) {
    const svg = XayChars.render(charAgent(agentType), { state: effectiveState(key), size: CHAR_BOX.w });
    return svg.replace('<svg ', `<svg x="${CHAR_BOX.x}" y="${CHAR_BOX.y}" data-char-key="${escapeHtml(key)}" `);
  }
  // 只改属性切状态，不重画（动画不重播、不闪）
  function syncChars() {
    document.querySelectorAll('svg.xc[data-char-key]').forEach(el => {
      const want = effectiveState(el.getAttribute('data-char-key'));
      if (el.getAttribute('data-state') !== want) XayChars.setState(el, want);
    });
  }
  function flash(key, state) {
    if (!key || !(key in baseStates)) return;
    transients[key] = { state, until: Date.now() + TRANSIENT_MS };
    setTimeout(syncChars, TRANSIENT_MS + 30);
  }

  // 把新 HTML 合进容器：角色集合没变时保留原来的角色节点，只替换其余部分
  function hasChar(node) { return node.nodeType === 1 && (node.matches('svg.xc') || !!node.querySelector('svg.xc')); }
  function patchNode(oldEl, newEl) {
    if (newEl.nodeType === 1 && newEl.matches('svg.xc')) return;   // 角色自己由 syncChars 切状态
    if (!hasChar(oldEl) || !hasChar(newEl)) {
      if (!oldEl.isEqualNode(newEl)) oldEl.replaceWith(newEl);
      return;
    }
    if (oldEl.tagName !== newEl.tagName) { oldEl.replaceWith(newEl); return; }
    [...oldEl.attributes].forEach(a => { if (!newEl.hasAttribute(a.name)) oldEl.removeAttribute(a.name); });
    [...newEl.attributes].forEach(a => { if (oldEl.getAttribute(a.name) !== a.value) oldEl.setAttribute(a.name, a.value); });
    patchChildren(oldEl, newEl);
  }
  // 含角色的子节点原地保留（移动节点会让动画重播），其余子节点按新内容换掉
  function patchChildren(oldEl, newEl) {
    const olds = [...oldEl.childNodes], news = [...newEl.childNodes];
    const oldChars = olds.filter(hasChar);
    if (oldChars.length !== news.filter(hasChar).length) { oldEl.replaceChildren(...news); return; }
    if (olds.length === news.length && olds.every((c, i) => hasChar(c) === hasChar(news[i]))) {
      olds.forEach((child, i) => patchNode(child, news[i]));
      return;
    }
    olds.forEach(c => { if (!hasChar(c)) c.remove(); });
    let i = 0, prev = null;
    news.forEach(n => {
      if (hasChar(n)) { prev = oldChars[i++]; patchNode(prev, n); }
      else if (prev) { prev.after(n); prev = n; }
      else { oldEl.insertBefore(n, oldEl.firstChild); prev = n; }
    });
  }
  function morph(container, html) {
    const next = document.createElement(container.tagName);
    next.innerHTML = html;
    const sig = root => [...root.querySelectorAll('svg.xc[data-char-key]')].map(el => el.getAttribute('data-char-key') + '|' + el.getAttribute('data-agent')).join(',');
    if (!hasChars() || !container.firstChild || sig(container) !== sig(next)) {
      container.innerHTML = html;
      return;
    }
    patchChildren(container, next);
  }

  // 工位书桌、显示器与状态动效渲染
  function renderDeskSvg(agentType, state, charKey) {
    const uid = nextId();
    const useChars = hasChars() && charKey;
    const charSvg = useChars ? renderCharInDesk(agentType, charKey) : renderCharacterSvg(agentType, state);

    // 显示器内部状态动效
    let monitorContent = '';
    let extraEffects = '';

    if (state === 'working') {
      // 显示器滚动代码行
      monitorContent = `
        <clipPath id="clip-${uid}"><rect x="22" y="26" width="54" height="36" rx="2"/></clipPath>
        <g clip-path="url(#clip-${uid})">

            <line x1="26" y1="31" x2="65" y2="31" stroke="#22C55E" stroke-width="2" stroke-linecap="round"/>
            <line x1="26" y1="37" x2="55" y2="37" stroke="#4D6BFE" stroke-width="2" stroke-linecap="round"/>
            <line x1="26" y1="43" x2="70" y2="43" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
            <line x1="26" y1="49" x2="48" y2="49" stroke="#9B72CB" stroke-width="2" stroke-linecap="round"/>
            <line x1="26" y1="55" x2="62" y2="55" stroke="#22C55E" stroke-width="2" stroke-linecap="round"/>
            <!-- 重复滚动线 -->
