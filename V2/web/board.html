<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>xay 看板</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230F1115'/%3E%3Ccircle cx='10' cy='16' r='3' fill='%2310A37F'/%3E%3Ccircle cx='22' cy='16' r='3' fill='%234D6BFE'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/web/board.css">
</head>
<body>
<!-- V2 看板（M5）：左侧是对话列表（含旧系统镜像过来的对话），右边是这个对话里每名员工一列，列身是他的命令行（cli-view.js）。 -->
<div class="app">
  <aside class="sidebar" aria-label="对话列表">
    <!-- 左上角切换（office-spec.md 二¾.1）：和公司页、对话版看板左上角同一组、同一个位置；链接按当前对话填（board.js setViewLinks） -->
    <div class="side-switch">
      <nav class="view-switch" aria-label="切换看法">
        <span class="vs-btn active" aria-current="page" title="看板：每名员工一列，看他的命令行">看板</span>
        <a class="vs-btn" id="vs-org" href="/org" title="公司页：谁在哪个组、做到哪">公司页</a>
        <a class="vs-btn" id="vs-canvas" href="/org?canvas=1" title="任务画布：整个大任务画成几条线">任务画布</a>
      </nav>
    </div>
    <div class="side-top">
      <label class="search">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M10.68 11.74a6 6 0 1 1 1.06-1.06l3.04 3.04a.75.75 0 1 1-1.06 1.06l-3.04-3.04zM11.5 7a4.5 4.5 0 1 0-9 0 4.5 4.5 0 0 0 9 0z"/></svg>
        <input id="search" type="search" placeholder="搜对话" autocomplete="off" aria-label="搜对话">
      </label>
    </div>
    <nav class="side-tree" id="conv-list"><div class="side-empty">正在读对话列表…</div></nav>
    <div class="side-foot">
      <span class="conn" id="conn"><span class="dot"></span><span>连接中…</span></span>
      <button type="button" class="link-btn" id="theme-btn" title="切换明暗">🌓 明暗</button>
    </div>
  </aside>
  <main class="main">
    <div class="demo-banner" id="demo-banner" hidden><b>这是示例数据</b><span>不是真的活。</span><a href="/" id="real-link">看真实数据</a></div>
    <header class="conv-head">
      <div class="txt">
        <h1 id="conv-title">正在读…</h1>
        <div class="line" id="conv-line"></div>
      </div>
    </header>
    <!-- 右上角工具（office-spec.md 二¾.2~3）：和对话版看板同一个位置；"纯 CLI"在这一页是按下的，再点回到对话版的同一个对话 -->
    <div class="conv-bar">
      <div class="tabs" id="tabs" role="tablist" aria-label="员工"></div>
      <div class="tools">
        <button type="button" class="link-btn" id="layout-btn" title="一次看一个人 / 所有人并排">并排</button>
        <a class="link-btn on" id="cli-btn" href="/" aria-pressed="true" title="纯 CLI：正开着。再点一下回到对话版看板的同一个对话"><span><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4l3 3-3 3M8 11h5"/></svg></span><span>纯 CLI</span></a>
        <a class="link-btn" id="files-btn" href="/" title="这个对话改过哪些文件，点一个看改了哪几行（在对话版看板里打开）"><span><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2h5l3 3v9H4zM9 2v3h3"/></svg></span><span>修改文件</span></a>
      </div>
    </div>
    <div class="dec-bar" id="dec-bar" hidden></div>
    <div class="cols tabs" id="cols"></div>
  </main>
</div>
<script src="/web/lib/cli-view.js"></script>
<script type="module" src="/web/lib/board.js"></script>
</body>
</html>
